<body class="min-h-screen text-gray-800 sm:flex sm:items-center sm:justify-center sm:p-4 bg-gray-100 sm:bg-gradient-to-br sm:from-blue-50 sm:to-indigo-100">

    <!-- Mobile: Full height, Desktop: Rounded card -->
    <div id="app" class="w-full max-w-3xl bg-white sm:shadow-2xl sm:rounded-2xl overflow-hidden min-h-screen sm:min-h-0 flex flex-col relative fade-in">
        
        <!-- Header -->
        <div class="bg-indigo-600 text-white px-4 py-5 sm:p-6 text-center shrink-0 z-30 shadow-md">
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight"><i class="fa-solid fa-graduation-cap mr-2"></i> GES 301</h1>
            <p class="text-indigo-100 mt-1 text-sm sm:text-base font-medium">Introduction to Entrepreneurial Skills</p>
        </div>

        <!-- Dynamic Content Container -->
        <div id="content" class="flex-grow flex flex-col bg-white">
            <!-- Content will be injected by JavaScript -->
        </div>
    </div>

    <script>
        // Question Bank derived from GES 301 Textbook.pdf
        // Q(topic, difficulty, question, correctAnswer, [distractors], rationale)
        // Options are shuffled at test start, so the correct answer is always written first here.
        const TOPICS = {
            history: "History & Concepts of Entrepreneurship",
            profile: "Entrepreneurial Profile, Process & Types",
            smallbiz: "Gender & Small Business Management",
            leadership: "Leadership, Unit Operations & Time Management",
            creativity: "Creativity & Innovation",
            opportunity: "Opportunities, HR & Entrepreneurial Marketing",
            feasibility: "Feasibility Studies & Business Plans",
            marketing: "Principles of Marketing & Market Plans",
            networking: "Networking",
            cases: "Case Methodology & Case Studies",
            ip: "Intellectual Property & Technology Transfer",
            legal: "Legal Issues, Regulation & Taxation",
            csr: "CSR & Environmental Considerations",
            ethics: "Business Ethics"
        };

        const questionBank = [];
        function Q(topic, difficulty, text, answer, distractors, rationale) {
            questionBank.push({ topic, difficulty, text, options: [answer, ...distractors], correct: 0, rationale });
        }

        // ===================== HISTORY & CONCEPTS =====================
        Q("history", "easy", "Who first introduced the term 'entrepreneur' in the early 18th century?",
            "Richard Cantillon", ["Adam Smith", "Joseph Schumpeter", "John Stuart Mill"],
            "The French economist Richard Cantillon formally defined the entrepreneur as the 'agent who buys means of production at certain prices in order to combine them' into a new product.");
        Q("history", "easy", "The word 'entrepreneur' is derived from the French verb 'entreprendre', which means:",
            "To undertake, to attempt, to try in hand", ["To innovate and invent", "To trade and barter", "To make a profit"],
            "'Entreprendre' means to undertake, to attempt, to try in hand, to contract for, or to adventure.");
        Q("history", "medium", "In the Middle Ages, an entrepreneur was simply someone who:",
            "Carried out tasks such as building and construction projects using all resources at his disposal", ["Lent money to merchants at interest", "Traded goods across national borders", "Invented new tools for farming"],
            "The term can be traced to the Middle Ages, when the entrepreneur was someone who carried out tasks such as buildings and construction projects by applying all the resources at his disposal.");
        Q("history", "medium", "What did J.B. Say add to Cantillon's definition of the entrepreneur?",
            "That entrepreneurs had to be leaders who bring people together to build a single productive organism", ["That entrepreneurs must bear all the risk of the business", "That entrepreneurs must be innovators who destroy old markets", "That entrepreneurs provide capital for production"],
            "Say added the idea of leadership: an entrepreneur brings other people together in order to build a single productive organism.");
        Q("history", "medium", "Under what broad English term did British economists such as Adam Smith, David Ricardo and J.S. Mill refer to entrepreneurship?",
            "Business management", ["Enterprise", "Commerce", "Risk bearing"],
            "British economists briefly touched on entrepreneurship under the broad English term 'business management'.");
        Q("history", "hard", "Which British economist stressed that entrepreneurship requires 'no ordinary skill' and lamented the lack of a good English word for it?",
            "John Stuart Mill", ["Adam Smith", "David Ricardo", "Alfred Marshall"],
            "Mill went out of his way to stress entrepreneurship's significance for growth, saying it needs 'no ordinary skill', and lamented there was no good English equivalent of the French term.");
        Q("history", "hard", "According to the text, whose writings suggest they likely UNDERVALUED the importance of entrepreneurship?",
            "Adam Smith and David Ricardo", ["John Stuart Mill and Alfred Marshall", "Cantillon and J.B. Say", "Schumpeter and McClelland"],
            "The writings of Smith and Ricardo suggest they likely undervalued entrepreneurship, whereas Mill stressed its significance.");
        Q("history", "medium", "Joseph Schumpeter described the entrepreneur's role as:",
            "'Creative destruction' – replacing an existing economy with a better, advanced one through innovation", ["Coordinating land, labour and capital", "Bearing uncertainty in the absence of information", "Imitating products from developed countries"],
            "Schumpeter asserted that the entrepreneur engages in 'creative destruction innovation', replacing or destroying an existing economy with a better one.");
        Q("history", "hard", "Schumpeter (1934) credited whom with bringing the term 'entrepreneur' into general use among economists?",
            "Mill (1848)", ["Cantillon (1730)", "Marshall (1890)", "Adam Smith (1776)"],
            "Schumpeter credited Mill (1848) with bringing the term into general use among economists.");
        Q("history", "medium", "At the Center for Entrepreneurial History at Harvard, Arthur H. Cole defined an entrepreneur as:",
            "An organization builder", ["A risk bearer", "A gap-filler", "A creative imitator"],
            "Arthur H. Cole, working at Harvard's Center for Entrepreneurial History, defined an entrepreneur as an organization builder.");
        Q("history", "medium", "In some modern theories mentioned in the text, the concept of the entrepreneur has expanded to include:",
            "The top tier of executives running a corporation", ["Only sole proprietors", "Government officials who regulate business", "Only founders of technology firms"],
            "Within the last two decades the concept evolved from a single individual to an entire organization, with some theories including top-tier corporate executives.");
        Q("history", "medium", "Which of these is cited as a historical entrepreneurship that revolutionized the food market with pre-packaged food?",
            "Heinz", ["Coca-Cola", "McDonald's", "Ford"],
            "Heinz is cited as the brand which brought about a revolution in the food market with pre-packaged food.");
        Q("history", "easy", "Before the advent of money, early entrepreneurship in Nigeria started with:",
            "Trade by barter", ["Colonial retail trade", "Commodity exports", "Cooperative societies"],
            "Early entrepreneurship in Nigeria started with trade by barter, where producers exchanged their surpluses for what they needed.");
        Q("history", "medium", "Modern entrepreneurship in Nigeria began when:",
            "Colonial masters brought in goods and services and made Nigerians their middlemen", ["Nigeria gained independence in 1960", "Oil was discovered in commercial quantity", "Formal education was introduced"],
            "Modern entrepreneurship started with the colonial masters, who made Nigerians middlemen engaged in retail trade or sole proprietorship.");
        Q("history", "medium", "Which TWO developments disrupted early entrepreneurial development in Nigeria?",
            "Colonial trading practices and the introduction of formal education", ["Civil war and military rule", "Oil boom and structural adjustment", "Trade by barter and lack of currency"],
            "The trading practices of the colonial masters and the introduction of formal education disrupted the flow of entrepreneurial development.");
        Q("history", "hard", "How did the colonial masters' trading practices harm Nigerian entrepreneurs?",
            "They dealt directly with raw material producers and refused to use Nigerian entrepreneurs in processing raw materials", ["They imposed high taxes on all Nigerian traders", "They banned Nigerians from owning land", "They introduced a currency Nigerians could not access"],
            "The colonialists dealt directly with producers of raw materials and refused Nigerian entrepreneurs a role in processing, which stunted their growth and skill acquisition.");
        Q("history", "hard", "According to the text, what was the effect of formal education on Nigeria's value system?",
            "Educated Nigerians took prestigious civil service jobs, creating dependency on colonial masters and later on government", ["It produced more industrial entrepreneurs", "It made agriculture the most respected occupation", "It encouraged Nigerians to export manufactured goods"],
            "Formal education gave access to civil service jobs with more prestige than entrepreneurship; dependency on colonial masters shifted to government after independence.");
        Q("history", "easy", "According to the text, who became the largest employer of labour in Nigeria?",
            "Government at Federal, State and Local levels", ["Multinational oil companies", "The informal private sector", "Agricultural cooperatives"],
            "The dominant public sector made government at all levels the largest employer of labour, while entrepreneurial ventures remained underdeveloped.");
        Q("history", "hard", "Hoselitz (1952) noted that writers have identified entrepreneurship with each of the following EXCEPT:",
            "Political lobbying", ["Uncertainty-bearing", "Coordination of productive resources", "Provision of capital"],
            "Hoselitz listed uncertainty-bearing, coordination of productive resources, introduction of innovation, and provision of capital.");
        Q("history", "medium", "For J.S. Mill, what differentiates entrepreneurs from managers?",
            "Risk bearing", ["Technical skill", "Formal education", "Ownership of land"],
            "Mill (1848) focused his definition on risk bearing as the differentiating factor between entrepreneurs and managers.");
        Q("history", "medium", "In 'Principles of Economics' (1890), Alfred Marshall listed four factors of production. Which is the coordinating factor driven by entrepreneurship?",
            "Organization", ["Land", "Labour", "Capital"],
            "Marshall's four factors were land, labour, capital and organization; organization coordinates the others and entrepreneurship drives it.");
        Q("history", "hard", "Which statement correctly reflects Marshall's view of entrepreneurial ability?",
            "The abilities are rare and numerous, but people can be taught to acquire them", ["The abilities are common and need no training", "The abilities are purely inborn and cannot be taught", "The abilities only matter in developed economies"],
            "Marshall said few people exhibit all the abilities to a high degree, yet implied people can be taught to acquire them.");
        Q("history", "hard", "Which of these is NOT one of Schumpeter's three forms of entrepreneurial motivation?",
            "The desire for job security", ["The desire to found a private kingdom or dynasty", "The will to win, fight and conquer", "The joy of creation and problem solving"],
            "Schumpeter's second typology: desire to found a private kingdom/dynasty, the will to win, and the joy of creation and problem solving.");
        Q("history", "hard", "Schumpeter's third typology concerns factors that inhibit entrepreneurial action. Which is NOT one of them?",
            "Lack of bank credit", ["The new and hard-to-plan nature of the innovative task", "Inertia in the psyche – resistance to change", "Fear of social sanctioning"],
            "The inhibitors are: the nature of the innovative task, psychological inertia, and fear of social sanctioning. Overcoming them needs strong will and 'personal weight'.");
        Q("history", "medium", "David McClelland's research in the 1960s reported three groups of competencies common to all entrepreneurs. They are:",
            "Proactivity, Achievement Orientation, Commitment to Others", ["Vision, Creativity, Knowledge", "Risk-taking, Innovation, Leadership", "Planning, Organizing, Controlling"],
            "McClelland's Table 1 groups competencies into Proactivity, Achievement Orientation and Commitment to Others.");
        Q("history", "hard", "In McClelland's competencies, 'Systematic Planning' (breaking a large task into subtasks) falls under:",
            "Achievement Orientation", ["Proactivity", "Commitment to Others", "Assertiveness"],
            "Achievement Orientation covers seeing opportunities, efficiency, concern for quality, systematic planning, and monitoring.");
        Q("history", "hard", "In McClelland's table, 'confronts problems with others directly; tells others what they have to do' describes:",
            "Assertiveness", ["Initiative", "Monitoring", "Commitment to work contract"],
            "Assertiveness (under Proactivity) means confronting problems with others directly and telling others what to do.");
        Q("history", "hard", "'Makes a personal sacrifice or expends extraordinary effort to complete a job' is McClelland's description of:",
            "Commitment to work contract", ["Efficiency orientation", "Concern for high quality of work", "Initiative"],
            "Commitment to work contract (under Commitment to Others) involves personal sacrifice and pitching in with workers.");
        Q("history", "hard", "Gartner (1990) segmented responses on what constitutes entrepreneurship using which technique?",
            "Delphi technique", ["Case method", "SWOT analysis", "Brainstorming"],
            "In 'What are we talking about when we talk about Entrepreneurship?', Gartner used a Delphi technique.");
        Q("history", "medium", "Which institution defines entrepreneurship as 'a way of thinking and acting that is opportunity obsessed, holistic in approach and leadership balanced'?",
            "Babson College", ["Harvard Business School", "Wharton School", "MIT"],
            "Babson College's definition (Solomon, 2008) describes entrepreneurship as opportunity obsessed, holistic and leadership balanced.");
        Q("history", "medium", "Who described the entrepreneur as 'an innovative person who creates something unique with value added... assuming financial, psychological and social risks'?",
            "Solomon and Winslow (1988)", ["Carland et al. (1984)", "Katz and Green (2006)", "Gartner (1990)"],
            "This working definition comes from Solomon and Winslow (1988).");
        Q("history", "hard", "Whereas Marshall saw entrepreneurship as the driving force behind organization, many economists today (Arnold, 1996) believe entrepreneurship is:",
            "By itself the fourth factor of production that coordinates the other three", ["A sub-component of capital", "Irrelevant to economic growth", "Identical to management"],
            "Many (not all) modern economists see entrepreneurship itself as the fourth factor of production.");
        Q("history", "medium", "According to Knight, an entrepreneur will bear the risk of a new venture if:",
            "He believes there is a significant chance for profit", ["The government guarantees the investment", "He has complete information", "There is no competition"],
            "Knight's risk-bearer view: the entrepreneur bears risk where he believes there is a significant chance for profit.");
        Q("history", "hard", "Mises' observation that 'any person who bears risk of losses could be called an entrepreneur' shows that:",
            "Risk-bearing alone cannot explain why some people become entrepreneurs", ["Everyone is naturally an entrepreneur", "Risk is irrelevant to entrepreneurship", "Only investors are entrepreneurs"],
            "The narrow risk-bearer definition is too broad; risk may be a factor, but other characteristics are needed to explain entrepreneurship.");
        Q("history", "hard", "Kirzner describes innovation as 'undeliberate learning'. The necessary characteristic of the entrepreneur in his view is therefore:",
            "Alertness", ["Capital", "Technical skill", "Leadership"],
            "For Kirzner, the necessary characteristic is alertness; no intrinsic skills other than recognizing opportunities are needed.");
        Q("history", "medium", "Leibenstein claims the dominant characteristic of entrepreneurs is that they are:",
            "Gap-fillers", ["Risk-bearers", "Organization builders", "Creative destroyers"],
            "Leibenstein: entrepreneurs perceive where the market fails and develop goods or processes the market demands but which are not being supplied.");
        Q("history", "easy", "The process where entrepreneurs in developing countries imitate and adapt products invented elsewhere is called:",
            "Creative imitation", ["Creative destruction", "Reverse engineering", "Spin-out"],
            "Drucker (1985) called it 'creative imitation' – imitators better understand how an innovation applies in their own market niche.");
        Q("history", "medium", "Combining the disparate theories, the text lists entrepreneurs in general as all of the following EXCEPT:",
            "Bureaucrats", ["Risk-bearers", "Gap-fillers", "Innovators or creative imitators"],
            "The generalized set: risk-bearers, coordinators and organizers, gap-fillers, leaders, and innovators or creative imitators.");
        Q("history", "hard", "Entrepreneurship at the macro level of society is best described as:",
            "An on-going process of transformation", ["A characteristic of a person", "A single business transaction", "A government policy"],
            "At the micro level it is a characteristic of a person; at the macro level it is an on-going process of societal transformation.");
        Q("history", "medium", "Which is NOT among the common features and functions of entrepreneurs summarized in Chapter One?",
            "Avoidance of all failure", ["Recognition of business opportunities", "Initiating ideas and actions", "Risk taking and tolerance for failure"],
            "The five features include risk taking AND tolerance for failure – not avoidance of failure.");

        // ===================== PROFILE, PROCESS & TYPES =====================
        Q("profile", "easy", "According to the text, are entrepreneurs born or made?",
            "Any person can be an entrepreneur through a combination of heredity, environment, orientation, training and experience", ["Only people born into business families", "Only those with university degrees", "Only those with large inheritance"],
            "With a combination of heredity, environment, appropriate orientation, training and experience, any person can be an entrepreneur.");
        Q("profile", "easy", "The story of George Washington Carver is used to illustrate which entrepreneurial quality?",
            "Vision", ["Perseverance", "Honesty", "Risk-taking"],
            "Carver is described as 'a man of vision' who identified a problem and turned it into an opportunity.");
        Q("profile", "medium", "How many derivative products did Carver develop from groundnuts and sweet potatoes respectively?",
            "300 and 118", ["118 and 300", "200 and 100", "500 and 150"],
            "Carver developed 300 derivative products from groundnuts and 118 from sweet potatoes.");
        Q("profile", "medium", "Why did Carver introduce groundnuts and sweet potatoes to southern U.S. farmers?",
            "Years of planting only cotton had devastated the farmland; the new crops restored soil fertility", ["Cotton prices had collapsed globally", "The government banned cotton farming", "Groundnuts were already the main cash crop"],
            "Farmlands were devastated by mono-cropping cotton; the new crops grew well and restored soil fertility.");
        Q("profile", "easy", "J.C. Penney's story illustrates which trait?",
            "Perseverance and drive", ["Creativity", "Honesty and discipline", "Adaptability"],
            "Penney is presented as 'a man of perseverance who beat the odds' despite bereavements and financial ruin.");
        Q("profile", "medium", "How much did J.C. Penney lose in the 1929 stock market crash, and at what age did he start the climb back?",
            "$40 million; age 56", ["$4 million; age 46", "$1 billion; age 60", "$40 million; age 36"],
            "He lost $40 million in 1929 and restarted at the age of fifty-six; by 1951 sales surpassed $1 billion a year.");
        Q("profile", "medium", "Ray Kroc, cited for persistence, was a kitchen wares salesman who in 1954 at age 52:",
            "Bought out the McDonald brothers and expanded their concept nationally, creating the fast-food industry", ["Founded Coca-Cola", "Opened the first department store chain", "Invented pre-packaged food"],
            "Kroc took the McDonald brothers' limited menu, fast service and low prices concept national.");
        Q("profile", "easy", "'A farmer that eats his seeds for the next planting season will have no harvest' illustrates:",
            "Willingness to defer gratification", ["Adaptability", "Independent-mindedness", "Risk-taking"],
            "Entrepreneurs should reinvest profit rather than spend it on luxuries, otherwise there is no working capital for the next opportunity.");
        Q("profile", "easy", "An entrepreneur who adjusts the business plan to changes in policy or availability of materials is showing:",
            "Adaptability", ["Optimism", "Perseverance", "Goal orientation"],
            "Adaptability: an entrepreneur should not be so rigid in following a plan if conditions change.");
        Q("profile", "medium", "The text defines honesty in an entrepreneur as:",
            "The ability to trust – being a person that can be relied on in actions and deeds", ["Never making a loss", "Strict obedience to employees", "Paying the lowest prices to suppliers"],
            "Honesty is 'the ability to trust'; an entrepreneur must be reliable and must not cheat or exploit customers.");
        Q("profile", "medium", "Why must an entrepreneur be 'independent-minded'?",
            "To avoid dropping an idea because of others' skepticism", ["To avoid hiring employees", "To avoid paying taxes", "To avoid making a business plan"],
            "Many people may dissuade a potential entrepreneur; those unable to decide for themselves may drop ideas others later succeed with.");
        Q("profile", "medium", "Why are prospective entrepreneurs encouraged to seek information from research institutes?",
            "They have human and material resources for research which an individual may lack", ["They provide free capital", "They guarantee profits", "They replace the need for creativity"],
            "Research institutes are 'partners in progress' with resources an individual entrepreneur may not have – but they should not stop the entrepreneur's own creativity.");
        Q("profile", "easy", "How many basic stages make up the entrepreneurial process?",
            "Seven", ["Five", "Four", "Ten"],
            "The seven stages: Motivational, Decision, Visionary, Mission, Resource Mobilization & Business Structuring, Commissioning, Operational.");
        Q("profile", "medium", "At which stage does the person succumb to the urge and become determined to start a venture?",
            "Decision stage", ["Motivational stage", "Visionary stage", "Mission stage"],
            "The Motivational stage is when a force drives the person; the Decision stage is when they succumb to the urge.");
        Q("profile", "hard", "Which is the FIFTH stage of the entrepreneurial process?",
            "Resource Mobilization and Business Structuring", ["Commissioning", "Mission", "Operational"],
            "Order: Motivational, Decision, Visionary, Mission, Resource Mobilization & Structuring (5th), Commissioning, Operational.");
        Q("profile", "medium", "The stage where the prospective entrepreneur forms a picture of what to do and how well to do it to meet the vision is the:",
            "Mission stage", ["Visionary stage", "Decision stage", "Commissioning stage"],
            "Visionary = basic structure and form conceived; Mission = what to do and how well to do it to meet the vision.");
        Q("profile", "easy", "In which stage does the business, having survived start-up hitches, go into full-blast operation?",
            "Operational stage", ["Commissioning stage", "Decision stage", "Mission stage"],
            "Commissioning is when the business takes off; Operational is the final full-blast stage.");
        Q("profile", "medium", "An entrepreneur who uses proceeds from the sale of one business to start another is a:",
            "Professional entrepreneur", ["Classical entrepreneur", "Induced entrepreneur", "First generation entrepreneur"],
            "The Professional entrepreneur sells one business to start another and is brimming with ideas for new ventures.");
        Q("profile", "easy", "An entrepreneur motivated by incentives, concessions and benefits offered by government is a(n):",
            "Induced entrepreneur", ["Pure entrepreneur", "Spontaneous entrepreneur", "Motivated entrepreneur"],
            "Induced entrepreneurs are moved by government incentives and concessions.");
        Q("profile", "medium", "A 'born' entrepreneur with inborn traits of confidence, vision and initiative is classified as a:",
            "Spontaneous entrepreneur", ["Pure entrepreneur", "Modern entrepreneur", "Growth entrepreneur"],
            "Spontaneous entrepreneurs are born entrepreneurs with inborn traits of confidence, vision and initiative.");
        Q("profile", "hard", "An entrepreneur motivated by psychological and economic rewards is classified as a:",
            "Pure entrepreneur", ["Motivated entrepreneur", "Induced entrepreneur", "Spontaneous entrepreneur"],
            "Pure entrepreneur: psychological and economic rewards. Motivated entrepreneur: sense of achievement and fulfilment.");
        Q("profile", "easy", "An entrepreneur who undertakes manufacturing activities ONLY (e.g., textiles, electronics) is a(n):",
            "Industrial entrepreneur", ["Trading entrepreneur", "Business entrepreneur", "Corporate entrepreneur"],
            "Industrial entrepreneurs undertake manufacturing only; business entrepreneurs deal with both manufacturing and trading.");
        Q("profile", "hard", "An entrepreneur who gives more importance to consistent returns than to growth is a(n):",
            "Classical entrepreneur", ["Modern entrepreneur", "Super growth entrepreneur", "First generation entrepreneur"],
            "Classical entrepreneurs value consistent returns over growth and are concerned about customer and marketing needs.");
        Q("profile", "medium", "Classification by 'Use of Technology' includes:",
            "Technical, Non-technical and Professional entrepreneurs", ["Pure, Induced and Motivated entrepreneurs", "Rural and Urban entrepreneurs", "Growth and Super growth entrepreneurs"],
            "Use of Technology: Technical, Non-Technical and Professional. Pure/Induced/Motivated/Spontaneous fall under Motivation.");
        Q("profile", "medium", "A business outfit contracts to provide security for a client but uses another outfit to carry out the service. This is:",
            "An indirect service", ["A direct service", "Material entrepreneurship", "A trade secret"],
            "An indirect service reaches its beneficiary through intermediaries other than the original provider. A mechanic fixing a car is a direct service.");
        Q("profile", "medium", "Which of the following is NOT listed as a benefit of entrepreneurship?",
            "Increased emigration of talents", ["Development of new markets", "Processing of local materials into finished goods", "Self-employment and job satisfaction"],
            "Entrepreneurship REDUCES the emigration of talents by creating a favourable domestic entrepreneurship climate.");

        // ===================== GENDER & SMALL BUSINESS =====================
        Q("smallbiz", "medium", "Mabogunje (1989) described the vast majority of women's economic activities as 'petty', meaning:",
            "Small-scale, small-size, low income base and low technological content", ["Illegal and informal", "Unprofitable and short-lived", "Dependent on husbands"],
            "'Petty' here means small-scale, small-size, low income base and low technological content.");
        Q("smallbiz", "medium", "In the case of Mrs F.G. of Ikereku, what opportunity did she recognize?",
            "Transport problems limited farmers' production, so she chartered trucks to carry cassava to Ibadan", ["There was no cassava processing mill in Oyo State", "Farmers lacked credit, so she lent them money", "Cassava prices were higher in Lagos"],
            "She recognized that bad roads meant farmers only planted what they could carry; her chartered trucks helped her and other farmers.");
        Q("smallbiz", "hard", "In the case of female timber 'converters' in Edo State, which was NOT mentioned as a constraint?",
            "Lack of capital", ["Electricity irregularity", "Equipment breakdown", "Both electricity and equipment problems were mentioned"],
            "The major problems were electricity irregularity and equipment breakdown; lack of capital was not mentioned as a constraint.");
        Q("smallbiz", "hard", "How many members did the Edo State 'Converters' Union' cooperative have?",
            "55", ["25", "100", "15"],
            "The converters formed a state-wide registered cooperative with 55 members.");
        Q("smallbiz", "medium", "According to the text, what is the overriding factor that assists potential entrepreneurs, notwithstanding socio-economic factors?",
            "A positive attitude", ["Access to bank loans", "Family wealth", "Government connections"],
            "Notwithstanding socio-economic factors, a positive attitude is always the overriding factor.");
        Q("smallbiz", "hard", "According to Table 2 (Gender and Entrepreneurship), the typical age range of female and male entrepreneurs is:",
            "Female 28–45; Male 22–40", ["Female 22–40; Male 28–45", "Female 18–30; Male 25–50", "Both 25–45"],
            "Table 2 lists female entrepreneurs between 28–45 and males between 22–40.");
        Q("smallbiz", "medium", "In Table 2, women entrepreneurs' attitude towards risk is described as:",
            "Averse to risk", ["Moderate risk takers", "High risk takers", "Indifferent to risk"],
            "Females: averse to risk. Males: moderate risk takers.");
        Q("smallbiz", "hard", "In the United States, the SBA generally defines a small manufacturing business as having fewer than:",
            "500 employees", ["50 employees", "15 employees", "250 employees"],
            "SBA: fewer than 500 employees for manufacturing and less than $7 million receipts for most non-manufacturing.");
        Q("smallbiz", "hard", "Under Australia's Fair Work Act 2009, a small business is one with fewer than:",
            "15 employees", ["50 employees", "200 employees", "500 employees"],
            "Australia: fewer than 15 employees. EU: fewer than 50. US: fewer than 500 (manufacturing).");
        Q("smallbiz", "medium", "In the European Union, a small business generally has fewer than ____ employees, and a medium business fewer than ____.",
            "50; 250", ["15; 200", "500; 1000", "20; 100"],
            "EU small business: fewer than 50; medium: fewer than 250.");
        Q("smallbiz", "hard", "The Federal and State Ministries of Industries define small businesses in Nigeria by value of installed fixed capital, which currently stands at:",
            "₦5 million (excluding building)", ["₦2 million (including building)", "₦500,000", "₦50 million"],
            "The value moved from ₦60,000 (1972) to ₦2m (1992) and currently stands at ₦5m, excluding the building.");

        function renderTestScreen() {

        function renderReviewScreen() {

            contentDiv.className = "flex-grow flex flex-col px-4 py-6 sm:p-8 bg-white sm:overflow-y-auto sm:max-h-[75vh]";

                if (state.answers[idx] === q.correct) score++;
            });

            const percentage = Math.round((score / state.questions.length) * 100);
            let feedback = '';
            if (percentage >= 80) feedback = "Excellent work! You have a solid grasp of the GES 301 material.";
            else if (percentage >= 50) feedback = "Good effort! Review the concepts below to solidify your understanding.";
            else feedback = "Keep studying! Carefully review the detailed rationales below to master these concepts.";

            let reviewHtml = `
                <div class="fade-in w-full max-w-3xl mx-auto pb-8">
                    
                    <!-- Score Card -->
                    <div class="text-center mb-8 bg-indigo-50 p-6 sm:p-8 rounded-2xl border border-indigo-100 shadow-sm">
                        <div class="inline-flex items-center justify-center w-20 h-20 bg-white rounded-full shadow mb-4">

                        </div>
                        <p class="text-xl font-bold text-gray-800 mb-2">Score: ${percentage}%</p>
                        <p class="text-sm sm:text-base text-gray-600 px-4">${feedback}</p>
                        <button onclick="initApp()" class="mt-6 w-full sm:w-auto px-8 py-3.5 sm:py-2.5 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold rounded-xl transition shadow-md">

                            if (qs.length === 0) return '';
                            const right = qs.filter(x => state.answers[x.i] === x.q.correct).length;
                            const pct = Math.round(right / qs.length * 100);
                            const bar = pct >= 70 ? 'bg-green-500' : pct >= 50 ? 'bg-yellow-400' : 'bg-red-500';
                            return `<div class="text-sm">
                                <div class="flex justify-between mb-1"><span class="text-gray-700 pr-2">${name}</span><span class="font-semibold text-gray-800 shrink-0">${right}/${qs.length}</span></div>

                            </div>`;
                        }).join('')}
                    </div>

                    <h3 class="text-lg sm:text-xl font-bold text-gray-800 mb-5 border-b pb-3 pl-1">Informed Review</h3>
                    <div class="space-y-5 sm:space-y-6">
            `;

            state.questions.forEach((q, idx) => {
                const userAnswer = state.answers[idx];
                const isCorrect = userAnswer === q.correct;
                const unanswered = userAnswer === undefined;

                let correctChoiceText = q.options[q.correct];

                        <div class="flex items-start">
                            <div class="mt-1 mr-3 sm:mr-4 flex-shrink-0 bg-white rounded-full">
                                ${isCorrect ? '<i class="fa-solid fa-circle-check text-green-500 text-2xl"></i>' : '<i class="fa-solid fa-circle-xmark text-red-500 text-2xl"></i>'}
                            </div>
                            <div class="flex-grow min-w-0"> <!-- min-w-0 fixes flexbox text truncation issues -->
                                <p class="font-semibold text-gray-800 mb-4 text-base sm:text-lg leading-relaxed"><span class="text-gray-400 mr-1">${idx + 1}.</span> ${q.text}</p>
                                
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-5 text-sm sm:text-base">
                                    <div class="bg-gray-50 p-3.5 sm:p-4 rounded-xl border border-gray-200">
                                        <p class="text-gray-500 mb-1.5 text-xs font-bold uppercase tracking-wider">Your Answer</p>
                                        <p class="${isCorrect ? 'text-green-700 font-semibold' : 'text-red-700 font-medium'} break-words">${userChoiceText}</p>
                                    </div>
                                    ${!isCorrect ? `
                                    <div class="bg-green-50 p-3.5 sm:p-4 rounded-xl border border-green-200">
                                        <p class="text-green-600 mb-1.5 text-xs font-bold uppercase tracking-wider">Correct Answer</p>
                                        <p class="text-green-800 font-semibold break-words">${correctChoiceText}</p>
                                    </div>
                                    ` : ''}
                                </div>

                                <div class="bg-blue-50/70 border-l-4 border-blue-400 p-4 sm:p-5 rounded-r-xl">
                                    <h4 class="text-xs font-bold text-blue-800 uppercase tracking-wider mb-2 flex items-center"><i class="fa-solid fa-book-open mr-2"></i> Rationale</h4>
                                    <p class="text-sm sm:text-base text-blue-900 leading-relaxed">${q.rationale}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            reviewHtml += `
                    </div>
                </div>
            `;
            
            contentDiv.innerHTML = reviewHtml;
            // Scroll to top of review screen
            window.scrollTo(0,0);
            if(contentDiv.scrollTo) contentDiv.scrollTo(0,0);
        }

        // --- APP LOGIC ---

        function startTest() {
            const numQ = parseInt(document.getElementById('numQuestions').value);
            const diff = document.getElementById('difficulty').value;
            const topic = document.getElementById('topic').value;
            const timeChoice = document.getElementById('timeLimit').value;

            // Filter questions
            let filteredQuestions = questionBank.filter(q =>
                (diff === 'mixed' || q.difficulty === diff) && (topic === 'all' || q.topic === topic));
            if (filteredQuestions.length === 0) {
                alert("No questions match that topic and difficulty. Try 'Mixed' difficulty.");
                return;
            }

            // Shuffle questions, take the requested count, then shuffle each question's options
            filteredQuestions = shuffleArray([...filteredQuestions]);
            const count = numQ === 0 ? filteredQuestions.length : Math.min(numQ, filteredQuestions.length);
            const selectedQuestions = filteredQuestions.slice(0, count).map(q => {
                const order = shuffleArray(q.options.map((_, i) => i));
                return { ...q, options: order.map(i => q.options[i]), correct: order.indexOf(q.correct) };
            });

            // Setup state
            state.questions = selectedQuestions;
            state.currentQuestionIndex = 0;
            state.answers = {};
            state.timeLimit = timeChoice === 'auto' ? Math.max(60, count * 45) : parseInt(timeChoice) * 60;
            state.timeRemaining = state.timeLimit;
            
            // Start Timer
            if (state.timerId) clearInterval(state.timerId);
            state.timerId = setInterval(timerTick, 1000);

            renderTestScreen();
            window.scrollTo(0,0);
        }

        function timerTick() {
            state.timeRemaining--;
            updateTimerDisplay();

            if (state.timeRemaining <= 0) {
                clearInterval(state.timerId);
                alert("Time's up! Submitting your test automatically.");
                submitTest();
            }
        }

        function updateTimerDisplay() {
            const timerEl = document.getElementById('timerDisplay');
            if (!timerEl) return;
            
            const m = Math.floor(state.timeRemaining / 60).toString().padStart(2, '0');
            const s = (state.timeRemaining % 60).toString().padStart(2, '0');
            timerEl.textContent = `${m}:${s}`;
            
            if (state.timeRemaining <= 60 && state.timeRemaining > 0) {
                timerEl.parentElement.classList.remove('text-indigo-600', 'bg-indigo-50');
                timerEl.parentElement.classList.add('text-red-600', 'bg-red-50', 'animate-pulse');
            }
        }

        function selectOption(index) {
            state.answers[state.currentQuestionIndex] = index;
            // Force re-render to update radio visual states
            renderTestScreen();
        }

        function nextQuestion() {
            if (state.currentQuestionIndex < state.questions.length - 1) {
                state.currentQuestionIndex++;
                renderTestScreen();
                window.scrollTo(0,0);
            }
        }

        function prevQuestion() {
            if (state.currentQuestionIndex > 0) {
                state.currentQuestionIndex--;
                renderTestScreen();
                window.scrollTo(0,0);
            }
        }

        function submitTest() {
            clearInterval(state.timerId);
            renderReviewScreen();
        }

        // Utility: Fisher-Yates Shuffle
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Boot
        initApp();
    </script>
</body>
</html>
