    <script>
        // Question Bank derived from GES 107 materials (GES 107 Textbook and the printed GES 107 book)
        // Q(topic, difficulty, question, correctAnswer, [distractors], rationale)
        // Options are shuffled at test start, so the correct answer is always written first here.
        const TOPICS = {
            living: "Healthy Living & Lifestyle",
            nutrition: "Nutrition: Carbohydrates, Fats, Protein & Water",
            micronutrients: "Vitamins & Minerals",
            microbes: "Microbes, Infection & Disease Transmission",
            reproductive: "Reproductive System & Health",
            sexuality: "Human Sexuality & Adolescent Behaviour",
            sti: "Sexually Transmitted Infections",
            hiv: "HIV: Epidemiology, Transmission & Prevention",
            hct: "HIV Counselling, Testing, Treatment & Care",
            sickle: "Sickle Cell Disease & Non-Communicable Diseases",
            drugs: "Drugs and Mankind",
            gender: "Gender Issues & Sexual Harassment"
        };

        const questionBank = [];
        function Q(topic, difficulty, text, answer, distractors, rationale) {
            questionBank.push({ topic, difficulty, text, options: [answer, ...distractors], correct: 0, rationale });
        }

        // ===================== HEALTHY LIVING =====================
        Q("living", "easy", "The WHO defines health as:",
            "A state of complete physical, mental and social well-being, and not merely the absence of disease", ["The absence of disease or infirmity", "Physical fitness only", "Having access to a hospital"],
            "Being healthy is more than not being ill.");
        Q("living", "easy", "Which is a characteristic of health?",
            "It is dynamic – active and ever changing", ["It is static and fixed", "Only the rich have a right to it", "It is only physical"],
            "Health is complete, has physical, mental and social components, and everyone has a right to it.");
        Q("living", "easy", "Lifestyle or behaviour simply refers to:",
            "What people do or fail to do", ["The genes a person inherits", "The hospital a person attends", "The climate where people live"],
            "Also called the habits of individuals.");
        Q("living", "medium", "According to Green & Kreuter (1991), lifestyle can:",
            "Add to or decrease a person's years of potential life", ["Not affect health at all", "Only affect mental health", "Only affect children"],
            "Lifestyles contribute to health, disease and quality of life.");
        Q("living", "medium", "The text says 'every disease whose cause is known has a':",
            "Behavioural component", ["Genetic component only", "Viral cause", "Cure"],
            "E.g. HIV is transmitted through modifiable behaviours.");
        Q("living", "medium", "Which behavioural risk factor is linked to malaria in the text?",
            "Not sleeping under an ITN and over-grown weeds", ["Smoking tobacco", "Use of alcohol", "Excessive speed"],
            "ITN = insecticide-treated net.");
        Q("living", "medium", "Cancer of the lungs is mainly linked to which behaviour?",
            "Smoking tobacco products", ["Eating fruits", "Lack of sleep", "Drinking water"],
            "Cancer of the liver is linked to alcohol use.");
        Q("living", "easy", "The three major lifestyle behaviours to stay healthy are:",
            "Eat well, rest well and exercise well", ["Work hard, study hard and pray", "Sleep, eat and drink", "Travel, read and dance"],
            "These are the three pillars of healthy living in the text.");
        Q("living", "medium", "How much physical activity is recommended daily to reap the full benefits of exercise?",
            "At least 30 minutes", ["At least 5 minutes", "At least 3 hours", "Once a week"],
            "Exercise helps maintain healthy weight and prevents heart disease, hypertension and diabetes.");
        Q("living", "medium", "Adults need an average of how many hours of sleep every day?",
            "8 hours", ["4 hours", "12 hours", "6 hours"],
            "Children need more; adequate rest prevents stress.");
        Q("living", "medium", "A person is said to be stressed when he/she is:",
            "Tense, anxious, worried and nervous", ["Well rested", "Physically fit", "Calm and focused"],
            "Stress limits the body's ability to prevent diseases.");
        Q("living", "easy", "Which of these is recommended for good eating?",
            "Eat more baked, steamed or grilled foods and fewer fried ones", ["Skip breakfast", "Drink more sugary beverages", "Eat more junk food"],
            "Also eat plenty of fruits and vegetables and drink plenty of water.");
        Q("living", "medium", "Which is a challenge of university life listed in the text?",
            "Pressure to become romantically involved", ["Too much free money", "No academic workload", "Lack of new freedom"],
            "Others: loneliness, new environment, accommodation, heavy workload.");
        Q("living", "hard", "Non-communicable diseases (NCDs) are described in the printed book as conditions that:",
            "Cannot be transmitted from one person to another and have no causative agent", ["Spread through the air", "Are caused by bacteria", "Only affect children"],
            "Unhealthy diet, inactivity and smoking are major risk factors for NCDs.");
        Q("living", "hard", "According to the printed book, which country has the second highest number of people living with HIV in the world (about 3.5 million in 2010)?",
            "Nigeria", ["South Africa", "Kenya", "India"],
            "The 2010 national survey showed adult HIV prevalence of 4.2%.");
        Q("living", "hard", "In Nigeria, unlike most of sub-Saharan Africa, HIV prevalence is higher in:",
            "Rural areas than urban areas", ["Urban areas than rural areas", "Only the northern states", "Only among the elderly"],
            "Stated in the introduction of the printed GES 107 book.");
        Q("living", "medium", "About 75% of malaria deaths in Nigeria occur among:",
            "Children under five", ["Adolescents", "The elderly", "Pregnant women only"],
            "One in ten maternal deaths is also due to malaria.");

        // ===================== NUTRITION =====================
        Q("nutrition", "easy", "Nutrition is the science that studies:",
            "How living organisms take in and use food for energy, growth, maintenance and health", ["Only how food is cooked", "Only the taste of food", "How food is sold"],
            "It includes digestion, absorption and use of nutrients by cells.");
        Q("nutrition", "medium", "Nutritional status can be assessed through dietary, biochemical, clinical and:",
            "Anthropometric methods", ["Astrological methods", "Psychological methods only", "Genetic methods only"],
            "Nutritional status is the health condition of an individual in relation to nutrition.");
        Q("nutrition", "medium", "An essential nutrient is one that:",
            "Cannot be synthesized in the body and must be obtained from the diet", ["The body makes in excess", "Is not needed by the body", "Is only found in drugs"],
            "Nutrients are grouped into macro and micronutrients.");
        Q("nutrition", "easy", "Diet refers to:",
            "What a person habitually eats", ["Only a weight-loss plan", "Fasting", "Medicine"],
            "Everyone is always on a diet; special diets can also be prescribed.");
        Q("nutrition", "easy", "The macronutrients are:",
            "Protein, fat and carbohydrate", ["Vitamins and minerals", "Water and fibre", "Iron and iodine"],
            "Micronutrients are vitamins and minerals.");
        Q("nutrition", "medium", "Which statement about food is correct according to the text?",
            "No single food item can supply all the necessary nutrients", ["Abundance of food guarantees good nutrition", "Too much food is never harmful", "All foods have identical nutrients"],
            "A variety of foods must be combined.");
        Q("nutrition", "medium", "Failure to grow in height due to poor nutrition is called:",
            "Stunting", ["Wasting", "Obesity", "Rickets"],
            "Wasting is sudden loss of weight.");
        Q("nutrition", "easy", "In carbohydrates, hydrogen and oxygen are present in the ratio:",
            "2:1 (as in water)", ["1:1", "1:2", "3:1"],
            "All carbohydrates contain carbon, hydrogen and oxygen.");
        Q("nutrition", "medium", "Plants manufacture carbohydrates through:",
            "Photosynthesis", ["Respiration", "Fermentation", "Digestion"],
            "Plants are the main source of carbohydrates.");
        Q("nutrition", "medium", "The form in which carbohydrate exists in the blood is:",
            "Glucose", ["Fructose", "Sucrose", "Starch"],
            "Fructose and galactose are converted to glucose.");
        Q("nutrition", "medium", "Fructose is also called:",
            "Levulose or fruit sugar", ["Milk sugar", "Table sugar", "Malt sugar"],
            "Sources: honey, fruits, vegetables.");
        Q("nutrition", "medium", "Sucrose (table sugar) consists of:",
            "One glucose and one fructose molecule", ["Two glucose molecules", "One glucose and one galactose", "Two fructose molecules"],
            "Maltose = 2 glucose; lactose = glucose + galactose.");
        Q("nutrition", "medium", "Lactose is found only in:",
            "Milk", ["Cane sugar", "Honey", "Cereals"],
            "Milk is the chief animal source of carbohydrate.");
        Q("nutrition", "hard", "Ranked in decreasing order of sweetness, which comes first?",
            "Fructose", ["Sucrose", "Glucose", "Lactose"],
            "Order: fructose, sucrose, glucose, lactose, dextrin, starch.");
        Q("nutrition", "medium", "When carbohydrate is adequate in the diet, it:",
            "Spares proteins from being used for energy", ["Causes protein deficiency", "Stops fat oxidation", "Destroys vitamins"],
            "Its chief function is to provide energy.");
        Q("nutrition", "hard", "Accumulation of ketones when too little carbohydrate is available, common in diabetics, is called:",
            "Diabetic acidosis", ["Kwashiorkor", "Marasmus", "Pellagra"],
            "Carbohydrates are needed for complete oxidation of fats.");
        Q("nutrition", "medium", "Dietary fibre (cellulose and hemicellulose) helps the body by:",
            "Absorbing water to form softer, bulkier stools for easy elimination", ["Providing most of the body's energy", "Building muscle", "Carrying oxygen"],
            "Fibre is undigested carbohydrate.");
        Q("nutrition", "medium", "What percentage of daily calorie intake should come from carbohydrates?",
            "45–50%", ["10–15%", "80–90%", "5%"],
            "The daily diet should contain not less than 100 g carbohydrate.");
        Q("nutrition", "medium", "Blood glucose is primarily regulated by the hormone:",
            "Insulin, produced by the pancreas", ["Adrenaline, from the adrenal gland", "Thyroxine, from the thyroid", "Oestrogen, from the ovary"],
            "Insufficient insulin causes excess blood sugar.");
        Q("nutrition", "medium", "Excess glucose is stored in the liver and muscles as:",
            "Glycogen", ["Starch", "Protein", "Cholesterol"],
            "And later as body fat.");
        Q("nutrition", "medium", "Dietary goals suggest that processed sugar intake should be reduced to:",
            "10% of total calories", ["50% of total calories", "30% of total calories", "0%"],
            "Excess sugar contributes to obesity, diabetes and tooth decay.");
        Q("nutrition", "medium", "Fat provides how many kilocalories per gram?",
            "9 kcal/g", ["4 kcal/g", "2 kcal/g", "15 kcal/g"],
            "Fat is a concentrated source of calories.");
        Q("nutrition", "medium", "Triglycerides, generally called neutral fats, are:",
            "Simple lipids", ["Compound lipids", "Derived lipids", "Proteins"],
            "Compound lipids include phospholipids; derived lipids include cholesterol.");
        Q("nutrition", "hard", "Cholesterol and bile salts are classified as:",
            "Derived lipids", ["Simple lipids", "Compound lipids", "Phospholipids"],
            "Derived from hydrolysis of simple or compound lipids.");
        Q("nutrition", "medium", "Diets rich in saturated fat and cholesterol are associated with:",
            "Coronary heart disease and atherosclerosis", ["Rickets", "Scurvy", "Night blindness"],
            "Polyunsaturated fats help reduce blood cholesterol.");
        Q("nutrition", "medium", "Protein contains about what percentage of nitrogen?",
            "16%", ["4%", "50%", "1%"],
            "Proteins are built from 20 amino acids.");
        Q("nutrition", "medium", "When nitrogen excretion is greater than nitrogen supplied by the diet, a person is in:",
            "Negative nitrogen balance", ["Positive nitrogen balance", "Nitrogen equilibrium", "Ketosis"],
            "Immunity and resistance to stress decline.");
        Q("nutrition", "medium", "The two forms of Protein-Energy Malnutrition (PEM) are:",
            "Kwashiorkor and marasmus", ["Rickets and scurvy", "Beriberi and pellagra", "Goitre and cretinism"],
            "Seen in infants and young children in poverty or neglect.");
        Q("nutrition", "medium", "Kwashiorkor typically occurs when a child:",
            "Gets enough calories from high-carbohydrate family diet but inadequate protein", ["Is weaned very early on a diet low in both calories and protein", "Eats too much protein", "Lacks vitamin C"],
            "Marasmus results from diets low in both calories and protein.");
        Q("nutrition", "medium", "The human body is made of about what percentage of water?",
            "60–75%", ["10–20%", "90–99%", "30–40%"],
            "Water helps regulate body temperature.");
        Q("nutrition", "medium", "Which is a function of water in the body?",
            "Serving as the body's transportation system for nutrients and wastes", ["Providing 9 kcal per gram", "Building bones directly", "Producing insulin"],
            "Water is also a lubricant and regulates temperature.");
        Q("nutrition", "medium", "Who needs MORE water according to the text?",
            "People on a high-fibre diet", ["People who are inactive", "People in cold climates only", "People who skip meals"],
            "Also children, the elderly, the physically active and those with vomiting/diarrhoea.");

        // ===================== VITAMINS & MINERALS =====================
        Q("micronutrients", "easy", "The fat-soluble vitamins are:",
            "A, D, E and K", ["B and C", "A, B, C and D", "C, D, E and K"],
            "Water-soluble vitamins are the B-complex and vitamin C.");
        Q("micronutrients", "medium", "A substance from which the body can synthesize a specific vitamin is a:",
            "Precursor or provitamin", ["Coenzyme", "Antioxidant", "Mineral"],
            "E.g. beta carotene is converted to retinol.");
        Q("micronutrients", "medium", "How many parts of beta carotene are needed to form one part of retinol?",
            "Six", ["Two", "Ten", "One"],
            "Beta carotene gives plants their orange/yellow colour.");
        Q("micronutrients", "easy", "Deficiency of vitamin A can result in:",
            "Night blindness", ["Scurvy", "Rickets", "Pellagra"],
            "Also dry skin and increased susceptibility to infection.");
        Q("micronutrients", "medium", "Vitamin A is stored in the:",
            "Liver", ["Kidney", "Bone", "Skin"],
            "So daily intake is not always necessary.");
        Q("micronutrients", "medium", "Vitamin D promotes the absorption of:",
            "Calcium and phosphorus", ["Iron and zinc", "Sodium and potassium", "Iodine and copper"],
            "This is needed for normal bone and tooth mineralisation.");
        Q("micronutrients", "medium", "Vitamin D deficiency in young children causes:",
            "Rickets", ["Beriberi", "Goitre", "Night blindness"],
            "In adults it causes osteomalacia (adult rickets).");
        Q("micronutrients", "medium", "Vitamin E is also known as:",
            "Tocopherol", ["Retinol", "Ascorbic acid", "Cobalamin"],
            "It is an antioxidant protecting polyunsaturated fatty acids.");
        Q("micronutrients", "medium", "Vitamin K is essential for:",
            "Blood clotting (formation of prothrombin)", ["Vision", "Bone growth", "Energy release"],
            "Its deficiency results in pronounced blood loss before coagulation.");
        Q("micronutrients", "medium", "Water-soluble vitamins must be taken daily because they:",
            "Are not stored in appreciable amounts in the body", ["Are toxic in small amounts", "Are made by the body", "Never get destroyed by cooking"],
            "They are easily destroyed by air, light and cooking.");
        Q("micronutrients", "medium", "Extreme thiamine (B1) deficiency, which can occur in alcoholics, results in:",
            "Beriberi", ["Pellagra", "Scurvy", "Rickets"],
            "Thiamine is essential for carbohydrate metabolism.");
        Q("micronutrients", "medium", "Niacin (vitamin B3) prevents:",
            "Pellagra", ["Beriberi", "Rickets", "Anaemia"],
            "Pellagra: skin sores, diarrhoea, dementia and death if untreated.");
        Q("micronutrients", "hard", "Sores on the lips and cracks at the corners of the mouth indicate deficiency of:",
            "Riboflavin (vitamin B2)", ["Vitamin K", "Vitamin D", "Iron"],
            "Riboflavin is destroyed by light.");
        Q("micronutrients", "hard", "Folate deficiency in pregnancy can lead to which defect in the baby?",
            "Spina bifida", ["Rickets", "Goitre", "Night blindness"],
            "Folate deficiency also causes megaloblastic anaemia.");
        Q("micronutrients", "medium", "Cobalamin (vitamin B12) is found in useful amounts only in:",
            "Animal foods", ["Fruits", "Cereals", "Vegetables"],
            "Its deficiency causes megaloblastic anaemia.");
        Q("micronutrients", "medium", "Bleeding gums and loosening of teeth indicate deficiency of:",
            "Vitamin C", ["Vitamin A", "Vitamin K", "Vitamin E"],
            "Vitamin C is needed for connective tissue and aids iron absorption.");
        Q("micronutrients", "medium", "Macro minerals are needed in amounts greater than:",
            "100 mg per day", ["1 mg per day", "10 g per day", "1,000 mg per day"],
            "Micro (trace) minerals are needed in amounts below 100 mg/day.");
        Q("micronutrients", "medium", "About 99% of the body's calcium is found in:",
            "The skeleton and teeth", ["The blood", "The muscles", "The liver"],
            "The remaining 1% is in the blood.");
        Q("micronutrients", "medium", "The best sources of calcium are:",
            "Milk and milk products", ["Citrus fruits", "Cereals", "Vegetable oils"],
            "Phytic and oxalic acids reduce calcium absorption from green vegetables.");
        Q("micronutrients", "medium", "Weak, fragile bones due to calcium deficiency is:",
            "Osteoporosis", ["Osteomalacia", "Arthritis", "Goitre"],
            "Calcium deficiency can also cause rickets.");
        Q("micronutrients", "medium", "Excess sodium is associated with:",
            "Hypertension and oedema", ["Night blindness", "Goitre", "Scurvy"],
            "Sodium controls fluid balance in extracellular fluid.");
        Q("micronutrients", "medium", "Potassium is an electrolyte found mainly in the:",
            "Intracellular fluid", ["Extracellular fluid", "Bones", "Hair"],
            "Sodium is in the extracellular fluid.");
        Q("micronutrients", "medium", "Iron is a component of haemoglobin; its principal role is to:",
            "Deliver oxygen to the body", ["Clot blood", "Form thyroid hormones", "Build teeth"],
            "Its deficiency results in anaemia.");
        Q("micronutrients", "medium", "Absorption of non-haem iron is enhanced by:",
            "Vitamin C", ["Phytic acid", "Oxalic acid", "Antacids"],
            "Phytic and oxalic acids reduce iron absorption.");
        Q("micronutrients", "medium", "Iodine deficiency causes goitre in adults and, in children:",
            "Cretinism", ["Rickets", "Kwashiorkor", "Beriberi"],
            "Iodine is a component of thyroid hormones.");
        Q("micronutrients", "hard", "Which mineral is essential for growth, wound healing, taste acuity and mobilization of vitamin A?",
            "Zinc", ["Copper", "Manganese", "Sodium"],
            "Its deficiency causes dwarfism and hypogonadism.");
        Q("micronutrients", "medium", "Unlike vitamins, minerals:",
            "Are not destroyed in food preparation but can be lost in discarded cooking water", ["Are organic compounds", "Provide energy directly", "Are made by the body"],
            "Minerals are inorganic and represent about 4% of body weight.");

        // ===================== MICROBES & INFECTION =====================
        Q("microbes", "easy", "Microorganisms that cause disease are called:",
            "Pathogens", ["Non-pathogens", "Normal flora", "Vectors"],
            "Non-pathogens do not cause disease and can be beneficial.");
        Q("microbes", "medium", "E. coli is beneficial in the large intestine but in the urinary system it:",
            "Causes an infection", ["Is also beneficial", "Dies immediately", "Becomes a virus"],
            "A microbe beneficial in one system can be pathogenic in another.");
        Q("microbes", "hard", "Surface molecules by which pathogens attach to host tissue are called:",
            "Adhesins or ligands", ["Antibodies", "Fomites", "Antigens only"],
            "They bind to complementary receptors on host cells.");
        Q("microbes", "medium", "Less than what percentage of bacteria are harmful?",
            "1%", ["50%", "25%", "90%"],
            "There are more bacteria in our mouths than humans on the planet.");
        Q("microbes", "medium", "Rod-shaped bacteria are called:",
            "Bacilli", ["Cocci", "Spirilla", "Vibrios"],
            "Streptococci form chains; staphylococci form clusters.");
        Q("microbes", "medium", "Bacteria arranged in clusters are:",
            "Staphylococci", ["Streptococci", "Diplococci", "Bacilli"],
            "Diplococci occur in pairs.");
        Q("microbes", "medium", "Ringworm, athlete's foot and thrush are caused by:",
            "Fungi", ["Bacteria", "Viruses", "Rickettsiae"],
            "Antibiotics do not kill fungi.");
        Q("microbes", "medium", "Malaria, trichomonas and amoebic dysentery are caused by:",
            "Protozoa", ["Fungi", "Viruses", "Helminths"],
            "Protozoa are one-celled animal-like organisms.");
        Q("microbes", "medium", "Parasites living inside cells, transmitted by fleas, lice and ticks, are:",
            "Rickettsiae", ["Viruses", "Fungi", "Protozoa"],
            "They cause typhus and Rocky Mountain spotted fever.");
        Q("microbes", "easy", "The smallest of all microorganisms, visible only with an electron microscope, are:",
            "Viruses", ["Bacteria", "Fungi", "Protozoa"],
            "They cannot reproduce outside a living cell and are not affected by antibiotics.");
        Q("microbes", "medium", "Which of the three viruses of major concern to health workers has a vaccine?",
            "Hepatitis B", ["Hepatitis C", "HIV", "None of them"],
            "Hepatitis C and HIV have no vaccine.");
        Q("microbes", "medium", "Microbes that grow best in the absence of oxygen are:",
            "Anaerobic", ["Aerobic", "Pathogenic", "Opportunistic"],
            "Aerobic microbes live only in the presence of oxygen.");
        Q("microbes", "medium", "An infection acquired in a health care facility is:",
            "Nosocomial", ["Endogenous", "Opportunistic", "Exogenous"],
            "About 5–6% of US hospital patients develop one.");
        Q("microbes", "medium", "Infections that occur when the body's defences are weak, e.g. pneumonia with AIDS, are:",
            "Opportunistic", ["Nosocomial", "Endogenous", "Zoonotic"],
            "They take advantage of weakened immunity.");
        Q("microbes", "medium", "How many elements make up the chain of infection?",
            "Six", ["Three", "Four", "Ten"],
            "Agent, reservoir, portal of exit, mode of transmission, portal of entry, susceptible host.");
        Q("microbes", "medium", "Objects contaminated with infectious material, such as doorknobs and linens, are:",
            "Fomites", ["Vectors", "Hosts", "Carriers"],
            "Fomites are reservoirs in the chain of infection.");
        Q("microbes", "easy", "One of the most effective means of preventing the spread of pathogens is:",
            "Hand washing", ["Taking antibiotics daily", "Avoiding water", "Wearing jewellery"],
            "Contaminated hands are a common source of direct transmission.");
        Q("microbes", "medium", "Diseases of animals that can be transmitted to humans, e.g. rabies, are called:",
            "Zoonoses", ["Nosocomial infections", "Endogenous diseases", "Prions"],
            "Animals are living reservoirs.");
        Q("microbes", "medium", "The two major non-living reservoirs of infectious disease are:",
            "Soil and water", ["Air and fire", "Food and drugs", "Metal and glass"],
            "Soil harbours fungi and Clostridium botulinum.");
        Q("microbes", "medium", "The easiest and most frequently travelled portal of entry for microbes is the:",
            "Respiratory tract", ["Skin", "Urogenital tract", "Eye"],
            "Examples: cold, pneumonia, influenza, measles.");
        Q("microbes", "medium", "Treponema pallidum, which penetrates genitourinary mucous membranes, causes:",
            "Syphilis", ["Gonorrhoea", "Chancroid", "Herpes"],
            "It is a bacterial STI.");
        Q("microbes", "medium", "Droplet transmission involves droplets propelled a short distance of:",
            "Less than 1 metre", ["More than 10 metres", "About 5 metres", "Any distance"],
            "Airborne transmission spreads over more than 1 metre.");
        Q("microbes", "medium", "Chickenpox, measles and tuberculosis are spread mainly by:",
            "Airborne transmission", ["Vector-borne transmission", "Common vehicle", "Direct sexual contact"],
            "Prevent by separate rooms and masks/respirators.");
        Q("microbes", "medium", "Meningococcus, influenza and pertussis are examples of:",
            "Droplet transmission", ["Airborne transmission", "Vector-borne transmission", "Parenteral transmission"],
            "Prevention: masks when within 1 metre, hand hygiene.");
        Q("microbes", "medium", "Transmission of disease agents by a common inanimate reservoir such as food or blood is:",
            "Common vehicle transmission", ["Vector-borne transmission", "Droplet transmission", "Airborne transmission"],
            "E.g. salmonellosis through contaminated food and water.");
        Q("microbes", "medium", "A vector that carries pathogens on its feet is a:",
            "Mechanical vector", ["Biological vector", "Fomite", "Carrier"],
            "Biological vectors transmit by bite or faeces.");
        Q("microbes", "medium", "The phenomenon where a critical concentration of immune hosts prevents spread of infection is:",
            "Herd immunity", ["Quarantine", "Isolation", "Contact tracing"],

                        `<button onclick="nextQuestion()" class="w-1/2 sm:w-auto px-4 py-3 sm:py-2.5 bg-indigo-600 active:bg-indigo-700 hover:bg-indigo-700 text-white font-bold rounded-xl sm:rounded-lg transition shadow-md text-center ml-2">
                            Next <i class="fa-solid fa-arrow-right ml-1 sm:ml-2"></i>
                        </button>`
                    }
                </div>
            `;
            
            updateTimerDisplay(); // Ensure immediate render
        }

        function renderReviewScreen() {
            // Adjust padding to allow full natural scrolling on mobile
            contentDiv.className = "flex-grow min-h-0 flex flex-col px-4 py-6 sm:p-8 bg-white overflow-y-auto";
            
            let score = 0;
            state.questions.forEach((q, idx) => {
                if (state.answers[idx] === q.correct) score++;
            });

            const percentage = Math.round((score / state.questions.length) * 100);
            let feedback = '';
            if (percentage >= 80) feedback = "Excellent work! You have a solid grasp of the GES 107 material.";
            else if (percentage >= 50) feedback = "Good effort! Review the concepts below to solidify your understanding.";
            else feedback = "Keep studying! Carefully review the detailed rationales below to master these concepts.";

            let reviewHtml = `
                <div class="fade-in w-full max-w-3xl mx-auto pb-8">
                    
                    <!-- Score Card -->
                    <div class="text-center mb-8 bg-indigo-50 p-6 sm:p-8 rounded-2xl border border-indigo-100 shadow-sm">
                        <div class="inline-flex items-center justify-center w-20 h-20 bg-white rounded-full shadow mb-4">
                            <h2 class="text-3xl font-black text-indigo-600">${score}<span class="text-lg text-gray-400">/${state.questions.length}</span></h2>
                        </div>
                        <p class="text-xl font-bold text-gray-800 mb-2">Score: ${percentage}%</p>
                        <p class="text-sm sm:text-base text-gray-600 px-4">${feedback}</p>
                        <button onclick="initApp()" class="mt-6 w-full sm:w-auto px-8 py-3.5 sm:py-2.5 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold rounded-xl transition shadow-md">
                            <i class="fa-solid fa-rotate-right mr-2"></i> Retake Setup
                        </button>
                    </div>
                    
                    <h3 class="text-lg sm:text-xl font-bold text-gray-800 mb-4 border-b pb-3 pl-1">Score by Topic</h3>
                    <div class="space-y-2 mb-8">
                        ${Object.entries(TOPICS).map(([key, name]) => {
                            const qs = state.questions.map((q, i) => ({ q, i })).filter(x => x.q.topic === key);
                            if (qs.length === 0) return '';
                            const right = qs.filter(x => state.answers[x.i] === x.q.correct).length;
                            const pct = Math.round(right / qs.length * 100);
                            const bar = pct >= 70 ? 'bg-green-500' : pct >= 50 ? 'bg-yellow-400' : 'bg-red-500';
                            return `<div class="text-sm">
                                <div class="flex justify-between mb-1"><span class="text-gray-700 pr-2">${name}</span><span class="font-semibold text-gray-800 shrink-0">${right}/${qs.length}</span></div>
                                <div class="w-full bg-gray-200 rounded-full h-2"><div class="${bar} h-2 rounded-full" style="width:${pct}%"></div></div>
                            </div>`;
                        }).join('')}
                    </div>

                    <h3 class="text-lg sm:text-xl font-bold text-gray-800 mb-5 border-b pb-3 pl-1">Informed Review</h3>
                    <div class="space-y-5 sm:space-y-6">
            `;

            state.questions.forEach((q, idx) => {
                const userAnswer = state.answers[idx];
                const isCorrect = userAnswer === q.correct;
                const unanswered = userAnswer === undefined;

                let userChoiceText = unanswered ? "<span class='italic text-gray-400'>Not answered</span>" : q.options[userAnswer];
                let correctChoiceText = q.options[q.correct];

                reviewHtml += `
                    <div class="bg-white border rounded-2xl p-4 sm:p-6 ${isCorrect ? 'border-green-200 shadow-sm' : 'border-red-200 shadow-sm'}">
                        <div class="flex items-start">
                            <div class="mt-1 mr-3 sm:mr-4 flex-shrink-0 bg-white rounded-full">
                                ${isCorrect ? '<i class="fa-solid fa-circle-check text-green-500 text-2xl"></i>' : '<i class="fa-solid fa-circle-xmark text-red-500 text-2xl"></i>'}
                            </div>
                            <div class="flex-grow min-w-0"> <!-- min-w-0 fixes flexbox text truncation issues -->
                                <p class="font-semibold text-gray-800 mb-4 text-base sm:text-lg leading-relaxed"><span class="text-gray-400 mr-1">${idx + 1}.</span> ${q.text}</p>
                                
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-5 text-sm sm:text-base">
                                    <div class="bg-gray-50 p-3.5 sm:p-4 rounded-xl border border-gray-200">
                                        <p class="text-gray-500 mb-1.5 text-xs font-bold uppercase tracking-wider">Your Answer</p>
                                        <p class="${isCorrect ? 'text-green-700 font-semibold' : 'text-red-700 font-medium'} break-words">${userChoiceText}</p>
                                    </div>
                                    ${!isCorrect ? `
                                    <div class="bg-green-50 p-3.5 sm:p-4 rounded-xl border border-green-200">
                                        <p class="text-green-600 mb-1.5 text-xs font-bold uppercase tracking-wider">Correct Answer</p>
                                        <p class="text-green-800 font-semibold break-words">${correctChoiceText}</p>
                                    </div>
                                    ` : ''}
                                </div>

                                <div class="bg-blue-50/70 border-l-4 border-blue-400 p-4 sm:p-5 rounded-r-xl">
                                    <h4 class="text-xs font-bold text-blue-800 uppercase tracking-wider mb-2 flex items-center"><i class="fa-solid fa-book-open mr-2"></i> Rationale</h4>
                                    <p class="text-sm sm:text-base text-blue-900 leading-relaxed">${q.rationale}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            reviewHtml += `
                    </div>
                </div>
            `;
            
            contentDiv.innerHTML = reviewHtml;
            // Scroll to top of review screen
            window.scrollTo(0,0);
            if(contentDiv.scrollTo) contentDiv.scrollTo(0,0);
        }

        // --- APP LOGIC ---

        function startTest() {
            const numQ = parseInt(document.getElementById('numQuestions').value);
            const diff = document.getElementById('difficulty').value;
            const topic = document.getElementById('topic').value;
            const timeChoice = document.getElementById('timeLimit').value;

            // Filter questions
            let filteredQuestions = questionBank.filter(q =>
                (diff === 'mixed' || q.difficulty === diff) && (topic === 'all' || q.topic === topic));
            if (filteredQuestions.length === 0) {
                alert("No questions match that topic and difficulty. Try 'Mixed' difficulty.");
                return;
            }

            // Shuffle questions, take the requested count, then shuffle each question's options
            filteredQuestions = shuffleArray([...filteredQuestions]);
            const count = numQ === 0 ? filteredQuestions.length : Math.min(numQ, filteredQuestions.length);
            const selectedQuestions = filteredQuestions.slice(0, count).map(q => {
                const order = shuffleArray(q.options.map((_, i) => i));
                return { ...q, options: order.map(i => q.options[i]), correct: order.indexOf(q.correct) };
            });

            // Setup state
            state.questions = selectedQuestions;
            state.currentQuestionIndex = 0;
            state.answers = {};
            state.timeLimit = timeChoice === 'auto' ? Math.max(60, count * 45) : parseInt(timeChoice) * 60;
            state.timeRemaining = state.timeLimit;
            
            // Start Timer
            if (state.timerId) clearInterval(state.timerId);
            state.timerId = setInterval(timerTick, 1000);

            renderTestScreen();
            window.scrollTo(0,0);
        }

        function timerTick() {
            state.timeRemaining--;
            updateTimerDisplay();

            if (state.timeRemaining <= 0) {
                clearInterval(state.timerId);
                alert("Time's up! Submitting your test automatically.");
                submitTest();
            }
        }

        function updateTimerDisplay() {
            const timerEl = document.getElementById('timerDisplay');
            if (!timerEl) return;
            
            const m = Math.floor(state.timeRemaining / 60).toString().padStart(2, '0');
            const s = (state.timeRemaining % 60).toString().padStart(2, '0');
            timerEl.textContent = `${m}:${s}`;
            
            if (state.timeRemaining <= 60 && state.timeRemaining > 0) {
                timerEl.parentElement.classList.remove('text-indigo-600', 'bg-indigo-50');
                timerEl.parentElement.classList.add('text-red-600', 'bg-red-50', 'animate-pulse');
            }
        }

        function selectOption(index) {
            state.answers[state.currentQuestionIndex] = index;
            // Force re-render to update radio visual states
            renderTestScreen();
        }

        function nextQuestion() {
            if (state.currentQuestionIndex < state.questions.length - 1) {
                state.currentQuestionIndex++;
                renderTestScreen();
                window.scrollTo(0,0);
            }
        }

        function prevQuestion() {
            if (state.currentQuestionIndex > 0) {
                state.currentQuestionIndex--;
                renderTestScreen();
                window.scrollTo(0,0);
            }
        }

        function submitTest() {
            clearInterval(state.timerId);
            renderReviewScreen();
        }

        // Utility: Fisher-Yates Shuffle
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Boot
        initApp();
    </script>
</body>
</html>
