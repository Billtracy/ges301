        <!-- Dynamic Content Container -->
        <div id="content" class="flex-grow min-h-0 flex flex-col bg-white">
            <!-- Content will be injected by JavaScript -->

    <script>
        // Question Bank derived from GES 104 materials (GES 104 Original, Science and Mankind e-module, GES 104 Summary)
        // Q(topic, difficulty, question, correctAnswer, [distractors], rationale)
        // Options are shuffled at test start, so the correct answer is always written first here.
        const TOPICS = {
            origin: "Man: Origin, Nature & Cosmic Environment",
            method: "Science, Scientific Method & Philosophy of Science",
            history: "History of Science & Origin of the Universe",
            physics: "Physics, Space Exploration & Exploitation",
            chemistry: "Chemistry & Industry",
            maths: "Mathematics, Statistics & Computing",
            biology: "The Cell, Ecosystem & Conservation",
            zoology: "Zoology in Food Production & Pest Control",
            geology: "Geology & the Environment of Man",
            tech: "Technology, Natural Resources & Energy",
            hazards: "Hazards, Pollution & Plastics",
            hiv: "HIV/AIDS"
        };

        const questionBank = [];
        function Q(topic, difficulty, text, answer, distractors, rationale) {
            questionBank.push({ topic, difficulty, text, options: [answer, ...distractors], correct: 0, rationale });
        }

        // ===================== MAN: ORIGIN & NATURE =====================
        Q("origin", "easy", "'Man know thyself' is described in the text as an ancient:",
            "Greek aphorism", ["Roman law", "Egyptian proverb", "Hebrew commandment"],
            "An aphorism is an original thought, spoken or written in memorable form; this one explains man's quest for knowledge.");
        Q("origin", "easy", "Which of these is NOT one of the three postulations on the origin of man discussed?",
            "The theory of spontaneous generation", ["Creation of the world and mankind by God", "The theory of natural selection (evolution)", "The theory of creationism"],
            "The three postulations are creation by God, natural selection (evolution) and creationism.");
        Q("origin", "easy", "According to the creation account, man was created to be tripartite, consisting of:",
            "Spirit, soul and body", ["Mind, will and emotions", "Flesh, blood and bone", "Reason, faith and love"],
            "Man is spirit, soul and body; the soul in turn consists of mind, will and emotions.");
        Q("origin", "medium", "The soul of man consists of:",
            "Mind, will and emotions", ["Spirit, soul and body", "Heart, lungs and brain", "Love, wisdom and glory"],
            "He understands with his mind and receives love and wisdom through his emotions and will.");
        Q("origin", "medium", "In the creation account, man's WILL is described as the receptacle of:",
            "Love", ["Wisdom", "Fear", "Knowledge"],
            "The will is the receptacle of love (free decisions); the understanding (mind) is the receptacle of wisdom.");
        Q("origin", "medium", "Man's 'danger', according to the text, was believing that:",
            "He really had life in himself instead of being merely a recipient of life", ["He was created by evolution", "He had no free will", "The earth was flat"],
            "This error led to self-love, a decline from the image of God into the 'image of hell or self-love'.");
        Q("origin", "medium", "The theory of natural selection is associated with:",
            "Charles Darwin", ["Philip Henry Gosse", "William Paley", "Carolus Linnaeus"],
            "Darwin's evolutionary selection was strongly opposed because it conflicted with the religious creation story.");
        Q("origin", "medium", "The text describes creationism and evolution as:",
            "Not a dichotomy but ends of a continuum", ["Identical theories", "Completely unrelated ideas", "Both rejected by science"],
            "Many intermediate positions (e.g. day-age, theistic evolution) lie between the two ends.");
        Q("origin", "easy", "Creationism is subdivided into:",
            "Christian and non-Christian creationists", ["Old and new creationists", "Eastern and Western creationists", "Scientific and religious creationists"],
            "Christian creationists include flat earthers, geocentrists and young-earth creationists; non-Christian include Raelians, panspermia and Vedic creationism.");
        Q("origin", "easy", "'Flat earthers' believe the earth is flat and covered by:",
            "A solid dome or firmament", ["A sea of fire", "An ozone shell", "Nothing at all"],
            "They hold that waters above the firmament caused Noah's flood.");
        Q("origin", "medium", "Geocentrists accept a spherical earth but deny that:",
            "The sun is the centre of the solar system or that the earth moves", ["God created the world", "Noah's flood occurred", "The earth is old"],
            "Geocentrism keeps the earth at the centre and stationary.");
        Q("origin", "medium", "Young-Earth Creationists (YEC) believe the earth is about:",
            "6,000 – 10,000 years old", ["4.5 billion years old", "15 billion years old", "1 million years old"],
            "YEC is based on a literal reading of the Bible, with a six-day creation; it is probably the most influential brand of creationism today.");
        Q("origin", "hard", "Which brand of creationism popularized the modern movement of 'scientific creationism'?",
            "Young-Earth Creationism", ["Gap Creationism", "Omphalos", "Day-Age Creationism"],
            "YEC accepts a spherical earth and heliocentric solar system but interprets geology in terms of Noah's flood.");
        Q("origin", "medium", "The 'Omphalos' idea, that the universe was created young but with the appearance of age, first appeared in a book by:",
            "Philip Henry Gosse (1857)", ["William Paley (1803)", "Charles Darwin (1859)", "John Locke (1690)"],
            "Omphalos holds that even earth's original soils were created looking old.");
        Q("origin", "hard", "Gap (Restitution) Creationism holds that:",
            "There was a long time gap between Genesis 1:1 and Genesis 1:2, after which God recreated the world in six days", ["Each day of creation was millions of years long", "God creates through evolution", "Life was brought by aliens"],
            "Gap creationism places a long temporal gap before a six-day recreation.");
        Q("origin", "medium", "Day-Age Creationism interprets each 'day' of creation as:",
            "A long period, even thousands or millions of years", ["A literal 24-hour day", "One thousand years exactly", "A symbolic moral lesson only"],
            "It sees a parallel between the creation story and the order accepted by mainstream science.");
        Q("origin", "hard", "The most common old-earth creationist view today, which sees the Big Bang as evidence of God's creative power, is:",
            "Progressive Creationism", ["Gap Creationism", "Omphalos", "Raelianism"],
            "Progressive creationism rejects much of modern biology, holding that newer kinds were specially created.");
        Q("origin", "hard", "Intelligent Design Creationism descends from whose argument (1803) that God's design can be seen in life?",
            "Paley", ["Gosse", "Darwin", "Kant"],
            "Today ID is used as an umbrella for the anti-evolution position.");
        Q("origin", "hard", "Evolutionary Creationism differs from theistic evolution only in its:",
            "Theology, not its science", ["Science, not its theology", "Age of the earth", "View of Noah's flood"],
            "It holds that Adam was not the first biological human but the first spiritually aware one.");
        Q("origin", "medium", "Theistic evolution holds that:",
            "God creates through evolution", ["The supernatural does not exist", "The earth is flat", "Life came from other planets"],
            "It accepts most of modern science but invokes God for things like the creation of the human soul; it is promoted by the Pope.");
        Q("origin", "hard", "Philosophical Materialistic Evolution holds that:",
            "The supernatural does not exist", ["God actively guides evolution", "The supernatural is neither affirmed nor denied", "Evolution was driven by catastrophes"],
            "Methodological materialism says nothing about the supernatural; philosophical materialism denies it.");
        Q("origin", "medium", "Which group believes life was created by scientists from another planet who were mistaken for gods?",
            "Raelians", ["Panspermia theorists", "Vedic creationists", "Geocentrists"],
            "Raelians say these scientists continue to visit the earth.");
        Q("origin", "medium", "Panspermia holds that:",
            "Primitive life (bacteria/microbes) was carried to earth from other star systems", ["Evolution happened suddenly through catastrophes", "Modern humans have existed for billions of years", "Giants and megafauna once co-existed"],
            "Other life then evolved from these microbes.");
        Q("origin", "hard", "Vedic creationism (from Hinduism) claims that:",
            "Anatomically modern humans have existed for billions of years", ["The earth is 6,000 years old", "Life came from aliens", "People shrank after a golden age"],
            "Hinduism speaks of a very old earth.");
        Q("origin", "hard", "Which creationist view says people and animals shrank in stature after a golden age ended with fire from volcanism?",
            "American-Indian creationism", ["Catastrophic evolution", "Vedic creationism", "Omphalos"],
            "It also holds that originally there was no essential difference between animals and people.");
        Q("origin", "easy", "The cosmic environment is made up of the geosphere, hydrosphere, atmosphere and:",
            "Biosphere", ["Ionosphere", "Exosphere", "Stratosphere"],
            "Geosphere (earth crust), hydrosphere (water), atmosphere (air), biosphere (living organisms).");
        Q("origin", "medium", "The two global problems named as resulting from human exploitation of the earth are:",
            "Climate change and ozone layer depletion", ["Earthquakes and volcanoes", "Floods and droughts", "Tsunamis and tides"],
            "Disturbing the carbon cycle raises earth's temperature; ozone-depleting substances create a hole in the ozone layer.");
        Q("origin", "easy", "The ozone layer protects the earth from:",
            "Cancer-causing ultraviolet rays from the sun", ["Meteorites", "Acid rain", "Cosmic dust"],
            "ODS (ozone-depleting substances) create holes in this protective layer.");
        Q("origin", "medium", "Polylactides are:",
            "Biodegradable plastics produced from lactic acid", ["Fossil fuels", "Nanoparticles in sunscreen", "Ozone-depleting gases"],
            "The lactic acid is obtained from fermentation of corn, a biotechnology concept.");
        Q("origin", "medium", "The use of biotechnology to treat waste through bioremediation is called:",
            "Environmental biotechnology", ["Nanotechnology", "Sericulture", "Genetic engineering"],
            "Biotechnology is also used for biofuels such as bioethanol and biodiesel.");
        Q("origin", "easy", "The word 'nano' comes from the Greek 'nanos', meaning:",
            "Dwarf", ["Tiny atom", "Invisible", "Fast"],
            "Nanotechnology uses bottom-up and top-down approaches.");
        Q("origin", "medium", "Which nanoparticle is used in antimicrobial bandages?",
            "Silver", ["Zinc oxide", "Aluminium silicate", "Titanium oxide"],
            "Sunscreen uses zinc or titanium oxide; scratch-resistant coatings use aluminium silicate.");
        Q("origin", "hard", "Self-cleaning glass made with nanotechnology is described as photocatalytic and:",
            "Hydrophilic – water spreads evenly across it, helping wash it clean", ["Hydrophobic – water forms beads", "Magnetic", "Radioactive"],
            "Hydrophilic glass lets water spread evenly over its surface.");
        Q("origin", "easy", "COMSAT stands for:",
            "Communication Satellite", ["Computer Satellite", "Commercial Satellite", "Combined Space Technology"],
            "Science and technology created a revolution in space through satellite and communication technology.");

        // ===================== SCIENCE, METHOD & PHILOSOPHY =====================
        Q("method", "easy", "The word 'science' comes from the Latin word 'scientia', which means:",
            "Knowledge", ["Experiment", "Nature", "Wisdom"],
            "The German 'Wissenschaft' means systematic investigation of objectively verifiable material phenomena.");
        Q("method", "easy", "The two broad classes of science are:",
            "Natural sciences and formal sciences", ["Pure and applied sciences only", "Physics and chemistry", "Ancient and modern sciences"],
            "Natural sciences study material beings; formal sciences (mathematics, sometimes logic) exist only in the mind.");
        Q("method", "medium", "Geology, geography and archaeology are classified as:",
            "Earth sciences", ["Physical sciences", "Biological sciences", "Mathematical sciences"],
            "Physical sciences: chemistry, physics, astronomy; biological: botany, zoology, microbiology, genetics.");
        Q("method", "medium", "Mathematics, statistics and computer science belong to the:",
            "Mathematical (numerate) sciences", ["Earth sciences", "Physical sciences", "Social sciences"],
            "They are the numerate sciences — they deal with numbers.");
        Q("method", "medium", "The problem of saying what is scientific and what is not is called the:",
            "Demarcation problem", ["Induction problem", "Paradigm shift", "Mind-body problem"],
            "Astrology and creationism are examples of beliefs claiming scientific status.");
        Q("method", "easy", "The only acceptable method of learning about a natural law, according to the text, is:",
            "Observation", ["Revelation", "Intuition", "Authority"],
            "Observation involves gathering data by taking measurements.");
        Q("method", "easy", "The correct order of the four main stages of the scientific method is:",
            "Observation → hypothesis → experiment → conclusion", ["Hypothesis → observation → conclusion → experiment", "Experiment → observation → hypothesis → conclusion", "Conclusion → hypothesis → experiment → observation"],
            "Observe, turn the observation into a hypothesis, test it with experiment, then draw a conclusion.");
        Q("method", "medium", "For a hypothesis to be considered scientific it must be:",
            "Falsifiable – worded so that it can be proven incorrect", ["Already proven true", "Approved by religious authority", "Impossible to test"],
            "In research we do not set out to 'prove' a hypothesis; we only test it.");
        Q("method", "medium", "The principle that the simplest satisfactory explanation is usually the best is the:",
            "Principle of parsimony", ["Principle of uncertainty", "Principle of falsifiability", "Principle of causation"],
            "Also expressed as Ockham's razor: entities should not be multiplied beyond necessity.");
        Q("method", "medium", "An experiment in which the experimental variable is NOT applied but dependent variables are measured the same way is a:",
            "Control experiment", ["Pilot experiment", "Field experiment", "Thought experiment"],
            "A control removes extraneous factors.");
        Q("method", "hard", "In scientific measurement, error due to the INSTRUMENT is called:",
            "Random error", ["Systematic error", "Human bias", "Parallax"],
            "Error in the method used is systematic or non-random error (bias in one direction).");
        Q("method", "hard", "Error in the METHOD used, which biases results in one direction, is called:",
            "Systematic (non-random) error", ["Random error", "Standard deviation", "Serendipity"],
            "Errors are usually considered in terms of standard deviation.");
        Q("method", "medium", "When a hypothesis has been proved by various independent researchers at various times, it becomes a:",
            "Scientific theory", ["Scientific law", "Scientific model", "Natural law"],
            "Theories are more certain than hypotheses but less certain than laws.");
        Q("method", "medium", "When overwhelming evidence supports a theory over a period of time, it becomes a:",
            "Scientific law", ["Hypothesis", "Model", "Paradigm"],
            "Examples: the law of gravity, the laws of thermodynamics.");
        Q("method", "hard", "The Bohr model of the atom is cited as an example of a scientific model because it:",
            "Gives good energy estimates but fails for angular momentum, so it has limited application", ["Has been proved under all conditions", "Was never tested", "Is a law of nature"],
            "A proven hypothesis with limited application becomes a model rather than a theory.");
        Q("method", "medium", "Theories can never be proved, only disproved. A conflict between a new observation and a long-standing theory often leads to what Kuhn called a:",
            "Paradigm shift", ["Scientific law", "Serendipity", "Demarcation"],
            "New observations can always conflict with old theories.");
        Q("method", "easy", "A discovery in science that came about accidentally is called:",
            "Serendipity", ["Induction", "Teleology", "Parsimony"],
            "Serendipity is listed alongside the common mistakes in scientific method application.");
        Q("method", "medium", "Drawing conclusions from empirical premises or observations is:",
            "Induction", ["Deduction", "Anthropomorphism", "Superstition"],
            "Induction can be by enumeration or by elimination.");
        Q("method", "hard", "'All fires that have been tested burn; therefore any fire will burn' is an example of:",
            "Induction by enumeration", ["Induction by elimination", "Deduction", "Teleological explanation"],
            "Enumeration compares the frequency of the event in samples with the untested population.");
        Q("method", "medium", "Deductive reasoning is:",
            "Drawing a conclusion from a set of pre-existing premises (general to specific)", ["Generalising from observed instances", "Explaining events by their purposes", "Attributing human features to objects"],
            "E.g. the earth rotates west to east, so the sun will always rise in the east.");
        Q("method", "medium", "Explaining events in terms of the purposes they serve is:",
            "Teleological explanation", ["Anthropomorphism", "Deduction", "Empiricism"],
            "It is listed as an unscientific method of thinking.");
        Q("method", "easy", "Attributing human characteristics to non-humans (objects, gods, devils) is called:",
            "Anthropomorphism", ["Superstition", "Teleology", "Relativism"],
            "Another unscientific method of thinking.");
        Q("method", "medium", "Which is a limitation of science stated in the text?",
            "Science cannot measure values like goodness, beauty or morality", ["Science can prove supernatural events", "Science is 100% certain", "Observers are never biased"],
            "Science only applies to observable events and no conclusion is free from legitimate doubt.");
        Q("method", "medium", "The school of thought that holds theories describe the world as it really is, independent of our perceptions, is:",
            "Scientific realism", ["Idealism", "Pragmatism", "Relativism"],
            "Realists say science reveals the hidden structure of the world.");
        Q("method", "medium", "Which school maintains that the aim of a theory is to be useful to us?",
            "Pragmatism", ["Realism", "Empiricism", "Idealism"],
            "Empiricism: a theory need only be empirically adequate; idealism: the world is constructed by the mind.");
        Q("method", "hard", "Relativism in science, which suggests that facts may change as theories change, was proposed by:",
            "Thomas Kuhn", ["Karl Popper", "David Hume", "William of Ockham"],
            "If evidence changes as theories change, perhaps the facts change too.");
        Q("method", "hard", "According to Wolpert (2005), cited in the text:",
            "A technologist need not know Newton's laws to design a bicycle", ["Science and technology are identical", "Technology always follows science", "Bicycles prove Newton's laws"],
            "Technology can advance by trial and error without in-depth understanding.");
        Q("method", "medium", "Ockham's razor states that:",
            "Entities should not be multiplied beyond necessity", ["Theories must be falsifiable", "Language biases observation", "Knowledge is updated with probabilities"],
            "Einstein rephrased it: 'make everything as simple as possible, but not simpler'.");
        Q("method", "hard", "The idea that the language we use biases the observations we make is:",
            "Whorfianism (Sapir-Whorf hypothesis)", ["Bayesianism", "Falsifiability", "Ockham's razor"],
            "Proposed by Edward Sapir and Benjamin Whorf in the 1930s.");
        Q("method", "medium", "The theory that for something to be science it must have the potential to be refuted was advanced by:",
            "Karl Popper", ["W.V. Quine", "Thomas Bayes", "Edward Sapir"],
            "Popper rejected Quine's view and proposed falsifiability.");
        Q("method", "hard", "Bayesianism, which holds that we never know anything 100% but update our confidence with evidence, is linked to Thomas Bayes and:",
            "E.T. Jaynes", ["Karl Popper", "W.V. Quine", "Benjamin Whorf"],
            "Jaynes formalised hypothesis construction using Bayes' rule.");
        Q("method", "medium", "Philosophy of science is defined as the branch of philosophy that studies:",
            "The philosophical assumptions, foundations and implications of science", ["Only laboratory techniques", "The history of inventions", "Religious beliefs about nature"],
            "It covers natural, social and formal sciences.");
        Q("method", "medium", "The argument from science to religion in the text is based on the theory of:",
            "Causation – every effect must have a cause", ["Relativity", "Natural selection", "Falsifiability"],
            "The order of the universe suggests a sole cause, which religion calls God.");

        // ===================== HISTORY OF SCIENCE & UNIVERSE =====================
        Q("history", "easy", "According to history, the first true scientists were the:",
            "Ancient Greeks (600 B.C. – 500 A.D.)", ["Ancient Egyptians", "Romans", "Chinese"],
            "Egyptians, Mesopotamians and Chinese collected facts but did not develop explanations.");
        Q("history", "medium", "Which Greek correctly predicted a 'short-term disappearance of the sun' (solar eclipse)?",
            "Thales", ["Anaximenes", "Ptolemy", "Archimedes"],
            "Thales studied the heavens and the movement of heavenly bodies.");
        Q("history", "medium", "Who was the first scientist to explain the origin of the human race without reference to a creator, saying life began in the sea?",
            "Anaximander", ["Aristotle", "Thales", "Leucippus"],
            "Darwin later restarted the idea, today called evolution.");
        Q("history", "medium", "The 'father of atomic theory', who proposed all matter is made of 'atoms', was:",
            "Leucippus", ["Dalton", "Anaximenes", "Archimedes"],
            "Leucippus built on Anaximenes' single-substance concept.");
        Q("history", "medium", "Aristotle's greatest scientific work was in:",
            "The classification of living things", ["The study of fluids", "Planetary orbits", "Optics"],
            "He also wrongly promoted spontaneous generation.");
        Q("history", "medium", "Archimedes is best known for his work on:",
            "Fluids – predicting whether an object will float", ["The geocentric system", "Microscopes", "Gravity"],
            "He also designed levers and screws.");
        Q("history", "easy", "The system in which the earth sits motionless at the centre of the universe is the:",
            "Geocentric (Ptolemaic) system", ["Heliocentric system", "Copernican system", "Newtonian system"],
            "It was considered correct until about the 1700s.");
        Q("history", "medium", "Science was impeded during the Dark Ages (500–1000 A.D.) largely because of the influence of the:",
            "Roman Empire", ["Greek city-states", "Islamic Empire", "Chinese dynasties"],
            "The Romans saw little use in explaining the world, though alchemists still experimented.");
        Q("history", "hard", "Who is often called the father of the scientific method and applied it to explaining the rainbow?",
            "Robert Grosseteste", ["Roger Bacon", "Galileo", "Francis Bacon"],
            "He said a scientist should observe, propose a tentative explanation, then test it with more observations.");
        Q("history", "hard", "Roger Bacon disproved the belief that a diamond could only be broken by:",
            "Goat's blood", ["Fire", "Hammering with gold", "Lion's fat"],
            "He used Grosseteste's method to break the shackles of superstition.");
        Q("history", "hard", "Who used mathematics and experiments to show most of Aristotle's ideas on motion were wrong?",
            "Thomas Bradwardine", ["Nicholas of Cusa", "Roger Bacon", "Ptolemy"],
            "Galileo later confirmed Bradwardine's work.");
        Q("history", "medium", "The Renaissance (1500–1660 A.D.) is called the:",
            "Golden Age of Science", ["Dark Ages", "Industrial Revolution", "Era of Newton"],
            "Copernicus, Vesalius, Kepler and Galileo worked in this period.");
        Q("history", "easy", "The heliocentric system places the sun at the centre and is also called the:",
            "Copernican system", ["Ptolemaic system", "Aristotelian system", "Geocentric system"],
            "Named in honour of Nicolaus Copernicus.");
        Q("history", "medium", "Kepler's data showed that planets travel around the sun in:",
            "Ellipses (oval paths)", ["Perfect circles", "Straight lines", "Spirals"],
            "Kepler's laws were among the strongest arguments for heliocentrism.");
        Q("history", "medium", "Andreas Vesalius is known for:",
            "Accurate illustrations of human organs, muscles and skeleton", ["Building the first microscope", "Discovering bacteria", "The laws of motion"],
            "He was a medical doctor of the Renaissance.");
        Q("history", "medium", "Galileo showed that the light from Venus goes through phases like the moon. This supported:",
            "The heliocentric view", ["The geocentric view", "Spontaneous generation", "Alchemy"],
            "He also showed planets only reflect sunlight.");
        Q("history", "medium", "Who built the first microscope and discovered bacteria during the Era of Newton?",
            "Antoni van Leeuwenhoek", ["Robert Boyle", "Robert Hooke", "Louis Pasteur"],
            "This revealed a previously invisible world of tiny life forms.");
        Q("history", "medium", "The Law of Mass Conservation (matter cannot be created or destroyed) is credited to:",
            "Antoine-Laurent Lavoisier", ["John Dalton", "James Joule", "Robert Boyle"],
            "Lavoisier was also the first to properly explain combustion.");
        Q("history", "medium", "Louis Pasteur finally destroyed the idea of:",
            "Spontaneous generation", ["Heliocentrism", "Atomic theory", "Natural selection"],
            "He also developed pasteurization and laid the foundation for most vaccines.");
        Q("history", "medium", "Who developed mathematical equations proving electricity and magnetism are aspects of one phenomenon?",
            "James Clerk Maxwell", ["Michael Faraday", "James Joule", "Max Planck"],
            "Faraday believed it but could not offer evidence; Maxwell proved it (electromagnetism).");
        Q("history", "medium", "The First Law of Thermodynamics (energy cannot be created or destroyed) is credited in the text to:",
            "James Joule", ["Lavoisier", "Carnot", "Newton"],
            "It is the guiding principle in the study of energy.");
        Q("history", "medium", "Max Planck proposed that energy exists in tiny packets called:",
            "Quanta", ["Atoms", "Molecules", "Electrons"],
            "This idea led to quantum mechanics.");
        Q("history", "hard", "Einstein used Planck's quanta to explain the:",
            "Photoelectric effect", ["Law of gravity", "Rainbow", "Theory of evolution"],
            "The photoelectric effect could not be explained by Newton's laws.");
        Q("history", "medium", "The Greek philosopher who first asked what the world was made of and answered 'water' was:",
            "Thales", ["Heraclitus", "Pythagoras", "Plato"],
            "His courage opened the floodgate for later scholars.");

                            </select>
                        </div>

                        <button onclick="startTest()" class="w-full mt-8 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold text-lg py-4 sm:py-3 px-4 rounded-xl transition duration-200 shadow-md">
                            <i class="fa-solid fa-play mr-2"></i> Start Test
                        </button>
                    </div>
                </div>
            `;
        }

        function renderTestScreen() {
            // Adjust padding specifically for test view
            contentDiv.className = "flex-grow min-h-0 flex flex-col bg-white relative";
            
            const question = state.questions[state.currentQuestionIndex];
            const progress = ((state.currentQuestionIndex) / state.questions.length) * 100;
            const isLastQuestion = state.currentQuestionIndex === state.questions.length - 1;

            let optionsHtml = '';
            question.options.forEach((opt, index) => {
                const isSelected = state.answers[state.currentQuestionIndex] === index;
                optionsHtml += `
                    <div class="mb-3 sm:mb-4 relative">
                        <input type="radio" name="option" id="opt_${index}" value="${index}" class="option-radio opacity-0 absolute inset-0 w-full h-full cursor-pointer z-10" ${isSelected ? 'checked' : ''} onchange="selectOption(${index})">
                        <label for="opt_${index}" class="option-label block w-full border border-gray-200 rounded-xl p-4 sm:p-5 cursor-pointer active:bg-gray-100 hover:bg-gray-50 flex items-center">
                            <span class="w-6 h-6 sm:w-7 sm:h-7 flex-shrink-0 border-2 rounded-full mr-4 flex items-center justify-center ${isSelected ? 'border-indigo-600 bg-indigo-600' : 'border-gray-300'}">
                                ${isSelected ? '<div class="w-2.5 h-2.5 sm:w-3 sm:h-3 bg-white rounded-full"></div>' : ''}
                            </span>
                            <span class="text-base sm:text-lg text-gray-800 leading-snug">${opt}</span>
                        </label>
                    </div>
                `;
            });

            contentDiv.innerHTML = `
                <!-- Sticky Header for Mobile & Desktop -->
                <div class="shrink-0 bg-white/95 backdrop-blur-sm z-20 px-5 sm:px-8 py-4 border-b border-gray-100 shadow-sm">
                    <div class="flex justify-between items-center mb-3">
                        <div class="text-xs sm:text-sm font-bold text-gray-500 uppercase tracking-wider">
                            Q ${state.currentQuestionIndex + 1} <span class="text-gray-300 mx-1">/</span> ${state.questions.length}
                        </div>
                        <div class="flex items-center text-base sm:text-lg font-bold ${state.timeRemaining <= 60 ? 'text-red-500 animate-pulse' : 'text-indigo-600'} bg-indigo-50 px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg">
                            <i class="fa-regular fa-clock mr-2"></i> <span id="timerDisplay">--:--</span>
                        </div>
                    </div>
                    <!-- Progress Bar -->
                    <div class="w-full bg-gray-200 rounded-full h-1.5 sm:h-2">
                        <div class="bg-indigo-500 h-1.5 sm:h-2 rounded-full transition-all duration-300 ease-out" style="width: ${progress}%"></div>
                    </div>
                </div>

                <!-- Scrollable Question Area -->
                <div class="flex-grow min-h-0 px-5 sm:px-8 py-6 overflow-y-auto fade-in">
                    <p class="text-xs font-bold text-indigo-500 uppercase tracking-wider mb-2">${TOPICS[question.topic]}</p>
                    <h3 class="text-xl sm:text-2xl font-semibold text-gray-800 mb-6 sm:mb-8 leading-relaxed">
                        ${question.text}
                    </h3>
                    <div class="mb-4">
                        ${optionsHtml}
                    </div>
                </div>

                <!-- Sticky Footer -->
                <div class="shrink-0 w-full bg-white border-t border-gray-200 p-4 sm:px-8 sm:py-5 z-20 flex justify-between items-center shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] sm:shadow-none">
                    <button onclick="prevQuestion()" class="${state.currentQuestionIndex === 0 ? 'invisible' : ''} w-1/2 sm:w-auto px-4 py-3 sm:py-2.5 text-gray-600 font-bold bg-gray-100 active:bg-gray-200 hover:bg-gray-200 rounded-xl sm:rounded-lg transition text-center mr-2">
                        <i class="fa-solid fa-arrow-left sm:mr-2"></i> <span class="hidden sm:inline">Previous</span>
                    </button>
                    
                    ${isLastQuestion ? 
                        `<button onclick="submitTest()" class="w-1/2 sm:w-auto px-4 py-3 sm:py-2.5 bg-green-600 active:bg-green-700 hover:bg-green-700 text-white font-bold rounded-xl sm:rounded-lg transition shadow-md text-center ml-2">
                            Submit <i class="fa-solid fa-check ml-1 sm:ml-2"></i>
                        </button>` 
                        : 
                        `<button onclick="nextQuestion()" class="w-1/2 sm:w-auto px-4 py-3 sm:py-2.5 bg-indigo-600 active:bg-indigo-700 hover:bg-indigo-700 text-white font-bold rounded-xl sm:rounded-lg transition shadow-md text-center ml-2">
                            Next <i class="fa-solid fa-arrow-right ml-1 sm:ml-2"></i>
                        </button>`
                    }
                </div>
            `;
            
            updateTimerDisplay(); // Ensure immediate render
        }

        function renderReviewScreen() {
            // Adjust padding to allow full natural scrolling on mobile
            contentDiv.className = "flex-grow min-h-0 flex flex-col px-4 py-6 sm:p-8 bg-white overflow-y-auto";
            
            let score = 0;
            state.questions.forEach((q, idx) => {
                if (state.answers[idx] === q.correct) score++;
            });

            const percentage = Math.round((score / state.questions.length) * 100);
            let feedback = '';
            if (percentage >= 80) feedback = "Excellent work! You have a solid grasp of the GES 104 material.";
            else if (percentage >= 50) feedback = "Good effort! Review the concepts below to solidify your understanding.";
            else feedback = "Keep studying! Carefully review the detailed rationales below to master these concepts.";

            let reviewHtml = `
                <div class="fade-in w-full max-w-3xl mx-auto pb-8">
                    
                    <!-- Score Card -->
                    <div class="text-center mb-8 bg-indigo-50 p-6 sm:p-8 rounded-2xl border border-indigo-100 shadow-sm">
                        <div class="inline-flex items-center justify-center w-20 h-20 bg-white rounded-full shadow mb-4">
                            <h2 class="text-3xl font-black text-indigo-600">${score}<span class="text-lg text-gray-400">/${state.questions.length}</span></h2>
                        </div>
                        <p class="text-xl font-bold text-gray-800 mb-2">Score: ${percentage}%</p>
                        <p class="text-sm sm:text-base text-gray-600 px-4">${feedback}</p>
                        <button onclick="initApp()" class="mt-6 w-full sm:w-auto px-8 py-3.5 sm:py-2.5 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold rounded-xl transition shadow-md">
                            <i class="fa-solid fa-rotate-right mr-2"></i> Retake Setup
                        </button>
                    </div>
                    
                    <h3 class="text-lg sm:text-xl font-bold text-gray-800 mb-4 border-b pb-3 pl-1">Score by Topic</h3>
                    <div class="space-y-2 mb-8">
                        ${Object.entries(TOPICS).map(([key, name]) => {
                            const qs = state.questions.map((q, i) => ({ q, i })).filter(x => x.q.topic === key);
                            if (qs.length === 0) return '';
                            const right = qs.filter(x => state.answers[x.i] === x.q.correct).length;
                            const pct = Math.round(right / qs.length * 100);
                            const bar = pct >= 70 ? 'bg-green-500' : pct >= 50 ? 'bg-yellow-400' : 'bg-red-500';
                            return `<div class="text-sm">
                                <div class="flex justify-between mb-1"><span class="text-gray-700 pr-2">${name}</span><span class="font-semibold text-gray-800 shrink-0">${right}/${qs.length}</span></div>
                                <div class="w-full bg-gray-200 rounded-full h-2"><div class="${bar} h-2 rounded-full" style="width:${pct}%"></div></div>
                            </div>`;
                        }).join('')}
                    </div>

                    <h3 class="text-lg sm:text-xl font-bold text-gray-800 mb-5 border-b pb-3 pl-1">Informed Review</h3>
                    <div class="space-y-5 sm:space-y-6">
            `;

            state.questions.forEach((q, idx) => {
                const userAnswer = state.answers[idx];
                const isCorrect = userAnswer === q.correct;
                const unanswered = userAnswer === undefined;

                let userChoiceText = unanswered ? "<span class='italic text-gray-400'>Not answered</span>" : q.options[userAnswer];
                let correctChoiceText = q.options[q.correct];

                reviewHtml += `
                    <div class="bg-white border rounded-2xl p-4 sm:p-6 ${isCorrect ? 'border-green-200 shadow-sm' : 'border-red-200 shadow-sm'}">
                        <div class="flex items-start">
                            <div class="mt-1 mr-3 sm:mr-4 flex-shrink-0 bg-white rounded-full">
                                ${isCorrect ? '<i class="fa-solid fa-circle-check text-green-500 text-2xl"></i>' : '<i class="fa-solid fa-circle-xmark text-red-500 text-2xl"></i>'}
                            </div>
                            <div class="flex-grow min-w-0"> <!-- min-w-0 fixes flexbox text truncation issues -->
                                <p class="font-semibold text-gray-800 mb-4 text-base sm:text-lg leading-relaxed"><span class="text-gray-400 mr-1">${idx + 1}.</span> ${q.text}</p>
                                
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-5 text-sm sm:text-base">
                                    <div class="bg-gray-50 p-3.5 sm:p-4 rounded-xl border border-gray-200">
                                        <p class="text-gray-500 mb-1.5 text-xs font-bold uppercase tracking-wider">Your Answer</p>
                                        <p class="${isCorrect ? 'text-green-700 font-semibold' : 'text-red-700 font-medium'} break-words">${userChoiceText}</p>
                                    </div>
                                    ${!isCorrect ? `
                                    <div class="bg-green-50 p-3.5 sm:p-4 rounded-xl border border-green-200">
                                        <p class="text-green-600 mb-1.5 text-xs font-bold uppercase tracking-wider">Correct Answer</p>
                                        <p class="text-green-800 font-semibold break-words">${correctChoiceText}</p>
                                    </div>
                                    ` : ''}
                                </div>

                                <div class="bg-blue-50/70 border-l-4 border-blue-400 p-4 sm:p-5 rounded-r-xl">
                                    <h4 class="text-xs font-bold text-blue-800 uppercase tracking-wider mb-2 flex items-center"><i class="fa-solid fa-book-open mr-2"></i> Rationale</h4>
                                    <p class="text-sm sm:text-base text-blue-900 leading-relaxed">${q.rationale}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            reviewHtml += `
                    </div>
                </div>
            `;
            
            contentDiv.innerHTML = reviewHtml;
            // Scroll to top of review screen
            window.scrollTo(0,0);
            if(contentDiv.scrollTo) contentDiv.scrollTo(0,0);
        }

        // --- APP LOGIC ---

        function startTest() {
            const numQ = parseInt(document.getElementById('numQuestions').value);
            const diff = document.getElementById('difficulty').value;
            const topic = document.getElementById('topic').value;
            const timeChoice = document.getElementById('timeLimit').value;

            // Filter questions
            let filteredQuestions = questionBank.filter(q =>
                (diff === 'mixed' || q.difficulty === diff) && (topic === 'all' || q.topic === topic));
            if (filteredQuestions.length === 0) {
                alert("No questions match that topic and difficulty. Try 'Mixed' difficulty.");
                return;
            }

            // Shuffle questions, take the requested count, then shuffle each question's options
            filteredQuestions = shuffleArray([...filteredQuestions]);
            const count = numQ === 0 ? filteredQuestions.length : Math.min(numQ, filteredQuestions.length);
            const selectedQuestions = filteredQuestions.slice(0, count).map(q => {
                const order = shuffleArray(q.options.map((_, i) => i));
                return { ...q, options: order.map(i => q.options[i]), correct: order.indexOf(q.correct) };
            });

            // Setup state
            state.questions = selectedQuestions;
            state.currentQuestionIndex = 0;
            state.answers = {};
            state.timeLimit = timeChoice === 'auto' ? Math.max(60, count * 45) : parseInt(timeChoice) * 60;
            state.timeRemaining = state.timeLimit;
            
            // Start Timer
            if (state.timerId) clearInterval(state.timerId);
            state.timerId = setInterval(timerTick, 1000);

            renderTestScreen();
            window.scrollTo(0,0);
        }

        function timerTick() {
            state.timeRemaining--;
            updateTimerDisplay();

            if (state.timeRemaining <= 0) {
                clearInterval(state.timerId);
                alert("Time's up! Submitting your test automatically.");
                submitTest();
            }
        }

        function updateTimerDisplay() {
            const timerEl = document.getElementById('timerDisplay');
            if (!timerEl) return;
            
            const m = Math.floor(state.timeRemaining / 60).toString().padStart(2, '0');
            const s = (state.timeRemaining % 60).toString().padStart(2, '0');
            timerEl.textContent = `${m}:${s}`;
            
            if (state.timeRemaining <= 60 && state.timeRemaining > 0) {
                timerEl.parentElement.classList.remove('text-indigo-600', 'bg-indigo-50');
                timerEl.parentElement.classList.add('text-red-600', 'bg-red-50', 'animate-pulse');
            }
        }

        function selectOption(index) {
            state.answers[state.currentQuestionIndex] = index;
            // Force re-render to update radio visual states
            renderTestScreen();
        }

        function nextQuestion() {
            if (state.currentQuestionIndex < state.questions.length - 1) {
                state.currentQuestionIndex++;
                renderTestScreen();
                window.scrollTo(0,0);
            }
        }

        function prevQuestion() {
            if (state.currentQuestionIndex > 0) {
                state.currentQuestionIndex--;
                renderTestScreen();
                window.scrollTo(0,0);
            }
        }

        function submitTest() {
            clearInterval(state.timerId);
            renderReviewScreen();
        }

        // Utility: Fisher-Yates Shuffle
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Boot
        initApp();
    </script>
</body>
</html>
