<body class="min-h-screen pb-20 text-gray-800 sm:flex sm:items-center sm:justify-center sm:px-4 sm:pt-4 bg-gray-100 sm:bg-gradient-to-br sm:from-blue-50 sm:to-indigo-100">

        <!-- Header -->

            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight"><i class="fa-solid fa-graduation-cap mr-2"></i> GES 106</h1>
            <p class="text-indigo-100 mt-1 text-sm sm:text-base font-medium">Philosophy, Logic and Critical Thinking</p>
        </div>

        <!-- Dynamic Content Container -->
        <div id="content" class="flex-grow min-h-0 flex flex-col bg-white">
            <!-- Content will be injected by JavaScript -->
        </div>
    </div>

    <script>
        // Question Bank derived from GES 106 materials (Course Outline, Course Overview, GES 106 Summary, Philosophy and Logic e-module, New Textbook)
        // Q(topic, difficulty, question, correctAnswer, [distractors], rationale)
        // Options are shuffled at test start, so the correct answer is always written first here.
        const TOPICS = {
            existence: "Philosophy & Human Existence",
            branches: "Meaning, Methods & Branches of Philosophy",
            epistemology: "Epistemology: Knowledge & Truth",
            metaphysics: "Metaphysics: Reality, Mind & God",
            ethics: "Ethical Theories & Moral Dilemmas",
            disciplines: "Philosophy, Science, Society & Other Disciplines",
            logic: "Nature & Scope of Logic; Arguments",
            formal: "Formal Logic: Connectives, Truth Tables & Inference",
            fallacies: "Formal & Informal Fallacies",
            meaning: "Language, Meaning & Definition",
            relations: "Relational Statements & Logical Puzzles"
        };

        const questionBank = [];
        function Q(topic, difficulty, text, answer, distractors, rationale) {
            questionBank.push({ topic, difficulty, text, options: [answer, ...distractors], correct: 0, rationale });
        }

        // ===================== PHILOSOPHY & HUMAN EXISTENCE =====================
        Q("existence", "easy", "Etymologically, 'philosophy' comes from the Greek words 'philo' and 'sophia', meaning:",
            "Love and wisdom", ["Study and nature", "Truth and reason", "Mind and soul"],
            "Philosophy is the love of wisdom – a persistent search for wisdom, not a claim to possess it.");
        Q("existence", "easy", "Who said 'an unexamined life is not worth living'?",
            "Socrates", ["Plato", "Aristotle", "Descartes"],
            "The quote captures philosophy as critical thinking.");
        Q("existence", "medium", "The first step in philosophizing, according to the text, is activating our:",
            "Curiosity and sense of wonder", ["Faith in authority", "Memory of facts", "Fear of the unknown"],
            "It is usually said that philosophy begins in wonder.");
        Q("existence", "medium", "Philosophy is described as inescapable because:",
            "We are curious beings and it fundamentally determines the quality and essence of our lives", ["It is compulsory in all universities", "It is required by law", "Only philosophers can live without it"],
            "Everyone consciously or unconsciously tries to make sense of their environment.");
        Q("existence", "medium", "A worldview is best described as:",
            "The framework of ideas and beliefs through which an individual interprets and interacts with the world", ["A map of the world's countries", "A scientific law", "A political party's manifesto"],
            "It explains the nature of the world, one's own nature and achievable goals.");
        Q("existence", "medium", "Critical thinking demands that you test your worldview for factual adequacy, logical coherence and:",
            "Explanatory capacity", ["Popularity", "Religious approval", "Emotional appeal"],
            "These are the three elements at the intersection of philosophy as worldview and as critical thinking.");
        Q("existence", "medium", "Testing whether your worldview agrees with relevant known facts and experiences is testing for:",
            "Factual adequacy", ["Logical coherence", "Explanatory capacity", "Soundness"],
            "Logical coherence asks whether the beliefs hang together without contradiction.");
        Q("existence", "medium", "If the beliefs making up a worldview contradict one another, the worldview fails the test of:",
            "Logical coherence", ["Factual adequacy", "Explanatory capacity", "Validity"],
            "Contradiction means at least one of the beliefs is false.");
        Q("existence", "hard", "The ability of a worldview to show how entities of the universe are related and to help us transform the universe is its:",
            "Explanatory capacity", ["Factual adequacy", "Logical coherence", "Prescriptive function"],
            "It enables us to shape the universe to suit our goals.");
        Q("existence", "medium", "Which is a reason given for constructing a view of the world for yourself?",
            "It gives insight into who you are, what you value and what you are capable of", ["It guarantees wealth", "It makes thinking unnecessary", "It replaces science"],
            "It also gives psychological confidence and helps you understand the physical world.");
        Q("existence", "hard", "Who observed that what philosophers do is much closer to what some children do?",
            "Gareth Matthews", ["Bertrand Russell", "Kwame Gyekye", "H.S. Staniland"],
            "Children's curiosity resembles philosophical wonder; as we grow, we take the world for granted.");
        Q("existence", "medium", "Philosophy has been described as a 'no-man's land' between:",
            "Science and theology", ["Art and music", "Law and medicine", "History and geography"],
            "Like science it critically studies the world; like theology it inquires beyond sense experience.");
        Q("existence", "medium", "Philosophy is called a 'gadfly' because it:",
            "Keeps humans always on their toes regarding received opinions", ["Studies insects", "Avoids criticism", "Depends on faith"],
            "It constantly questions accepted beliefs.");
        Q("existence", "medium", "The only common element in most definitions of philosophy is its posture as:",
            "A critical inquiry into the nature of things", ["A religious practice", "An experimental science", "A political ideology"],
            "There is no univocal definition of philosophy.");

        // ===================== MEANING, METHODS & BRANCHES =====================
        Q("branches", "medium", "Kwame Gyekye defined philosophy as:",
            "A critical and systematic inquiry into the fundamental ideas or principles underlying human thought", ["The criticism of the ideas we live by", "The search for the guide of life", "The love of wisdom only"],
            "Gyekye is an African philosopher.");
        Q("branches", "medium", "H.S. Staniland defined philosophy simply as:",
            "The criticism of the ideas we live by", ["The search for the guide of life", "Love of wisdom", "A gadfly"],
            "This critical tendency is why philosophy engages other disciplines.");
        Q("branches", "medium", "According to Chatalian, philosophy is essentially:",
            "The search for the guide of life", ["The criticism of ideas", "Linguistic analysis", "The study of nature"],
            "Different scholars emphasise different aspects of philosophy.");
        Q("branches", "hard", "Which African philosopher said philosophy everywhere is to examine the intellectual foundations of life for human well-being?",
            "Kwasi Wiredu", ["Kwame Gyekye", "Joseph Omoregbe", "C.S. Momoh"],
            "Wiredu stressed using the best available knowledge and reflection.");
        Q("branches", "medium", "The Socratic conception of philosophy holds that philosophers should:",
            "Be critical, live by example as moral exemplars and stand by the truth", ["Limit themselves to linguistic analysis", "Avoid practical life", "Accept tradition without question"],
            "Associated with Socrates and Plato.");
        Q("branches", "medium", "Philosophy as Contemplation, where philosophers are 'citizens of the universe' and questions are open-ended, is associated with:",
            "Bertrand Russell", ["Ludwig Wittgenstein", "Karl Marx", "Socrates"],
            "It rejects the compartmentalization of knowledge.");
        Q("branches", "medium", "Philosophy as Analysis, a 'method of therapy' through linguistic clarification, is represented by:",
            "Ludwig Wittgenstein", ["Bertrand Russell", "Karl Marx", "Plato"],
            "It is content with conceptual analysis.");
        Q("branches", "hard", "Philosophy as the Unity of Theory and Practice is exemplified by:",
            "Marx's eleventh thesis on Feuerbach", ["Wittgenstein's therapy", "Russell's contemplation", "Descartes' methodic doubt"],
            "It seeks to make the world better than it is, uniting the other conceptions.");
        Q("branches", "easy", "The four cardinal branches of philosophy are:",
            "Epistemology, metaphysics, ethics and logic", ["Physics, chemistry, biology and logic", "Ethics, law, politics and art", "Ontology, cosmology, psychology and theology"],
            "Other branches (philosophy of science, law, etc.) address other disciplines.");
        Q("branches", "easy", "Epistemology comes from 'episteme' and 'logos', meaning:",
            "Knowledge and theory", ["Being and study", "Love and wisdom", "Value and judgement"],
            "Epistemology is the theory of knowledge.");
        Q("branches", "medium", "Metaphysics is divided into:",
            "Ontology and cosmology", ["Ethics and aesthetics", "Deductive and inductive", "Normative and meta-ethics"],
            "Ontology studies being; cosmology studies the physical universe.");
        Q("branches", "medium", "Value theory is divided into:",
            "Ethics and aesthetics", ["Ontology and cosmology", "Logic and epistemology", "Rationalism and empiricism"],
            "Aesthetics studies the production, appreciation and experience of art.");
        Q("branches", "medium", "The branch of philosophy that studies works of art and beauty is:",
            "Aesthetics", ["Ethics", "Ontology", "Epistemology"],
            "It is part of value theory.");
        Q("branches", "medium", "Which of these is NOT listed among the methods of philosophy?",
            "Laboratory experimentation", ["Methodic doubt", "Dialectical method", "Philosophical argumentation"],
            "Methods include criticism, argumentation, methodic doubt, dialectic, inquiry and analysis.");
        Q("branches", "medium", "The analytic function of philosophy is:",
            "The analysis and clarification of ideas, concepts, statements or beliefs", ["Formulating norms to guide life", "Speculating about being in general", "Conducting experiments"],
            "Other functions: speculative, prescriptive and critical thinking.");
        Q("branches", "medium", "The prescriptive function of philosophy involves:",
            "Formulating goals, norms and standards to guide culture and life", ["Clarifying concepts", "Speculating about existence", "Measuring natural phenomena"],
            "Prescriptive = what ought to be.");
        Q("branches", "medium", "The speculative function of philosophy refers to:",
            "Our ability to think, reason and establish conjectures about existence and being", ["Analysis of language", "Formulating laws", "Detecting fallacies"],
            "Speculation is reflective thinking about reality as a whole.");
        Q("branches", "medium", "Philosophy raising conceptual questions about the foundations of other disciplines is described as:",
            "Second-order activity", ["First-order activity", "Empirical research", "Applied ethics"],
            "First-order: reflecting directly on knowledge, ethics and correct thinking.");
        Q("branches", "hard", "Philosophy is said to be 'both a first-order and a second-order discipline'. Its first-order role is:",
            "Reflecting on essential subjects such as knowledge, ethics and correct thinking", ["Investigating the projects of other disciplines", "Writing laws", "Doing experiments"],
            "Second-order: investigating the projects of other disciplines.");
        Q("branches", "easy", "Philosophy started in ancient Greece around the:",
            "5th century B.C.", ["1st century A.D.", "10th century B.C.", "15th century A.D."],
            "The Ionian philosophers reflected on puzzling natural phenomena.");
        Q("branches", "hard", "Who defined epistemology as the branch studying the nature, origin, foundation, method, validity, extent and limits of human knowledge?",
            "Joseph Omoregbe", ["Kwame Gyekye", "K.A. Owolabi", "Ozumba"],
            "Omoregbe also defined ethics as studying the morality of human conduct.");

        // ===================== EPISTEMOLOGY =====================
        Q("epistemology", "easy", "Epistemology is the branch of philosophy concerned with:",
            "The sources, scope and justification of knowledge", ["The nature of reality", "Right and wrong conduct", "Valid rules of inference"],
            "It is the theory of knowledge.");
        Q("epistemology", "easy", "Empiricism holds that the ultimate source of knowledge is:",
            "Sense experience", ["Reason", "Revelation", "Intuition"],
            "Rationalism accords priority to reason.");
        Q("epistemology", "easy", "Rationalism holds that the ultimate source of genuine knowledge is:",
            "Reason", ["Sense experience", "Tradition", "Authority"],
            "Rationalism does not deny sense experience but gives priority to reason.");
        Q("epistemology", "medium", "John Locke described the mind at birth as:",
            "Tabula rasa – a blank slate", ["Full of innate ideas", "A world of forms", "A thinking substance"],
            "Locke was an empiricist.");
        Q("epistemology", "medium", "Which group lists only empiricists?",
            "John Locke, George Berkeley and David Hume", ["Descartes, Spinoza and Leibniz", "Plato, Kant and Hegel", "Locke, Descartes and Plato"],
            "These are the classical British empiricists.");
        Q("epistemology", "medium", "Which group lists only rationalists?",
            "Plato, René Descartes, Spinoza and Leibniz", ["Locke, Berkeley and Hume", "Moore, Locke and Plato", "Hume, Kant and Berkeley"],
            "Rationalists say reason alone is the source of knowledge.");
        Q("epistemology", "hard", "Who claimed that neither experience nor reason alone fully accounts for knowledge, but both play important roles?",
            "Immanuel Kant", ["David Hume", "René Descartes", "John Locke"],
            "Kant synthesised rationalism and empiricism.");
        Q("epistemology", "medium", "Plato believed the human soul:",
            "Pre-existed in the world of forms where it knew all things, but forgot on uniting with the body", ["Is a blank slate at birth", "Is identical with the brain", "Learns only through the senses"],
            "Knowledge is recollection for Plato.");
        Q("epistemology", "medium", "Methodological scepticism, strongly held by Descartes, says:",
            "We can know things, but must doubt all claims to arrive at what cannot be doubted", ["Nothing at all can be known", "Knowledge is impossible in one area only", "Senses never mislead"],
            "Philosophical scepticism says we can never be certain, so we cannot know.");
        Q("epistemology", "medium", "The view that knowledge may be possible elsewhere but is unavailable in a selected area is:",
            "Local scepticism", ["Global scepticism", "Methodological scepticism", "Extreme scepticism"],
            "Global scepticism says we cannot know anything.");
        Q("epistemology", "medium", "The traditional account of knowledge defines knowledge as:",
            "Justified true belief", ["Strong opinion", "Any belief held by many", "Faith supported by authority"],
            "S knows P if S believes P, P is true, and S has reasons to believe P.");
        Q("epistemology", "hard", "Who argued that the three criteria of justified true belief are necessary but NOT sufficient for knowledge?",
            "Edmund Gettier", ["Immanuel Kant", "John Locke", "Plato"],
            "This led to controversies on what knowledge is.");
        Q("epistemology", "hard", "Non-inferential beliefs that justify themselves and support inferential beliefs are called:",
            "Foundations of knowledge", ["Synthetic judgements", "A posteriori truths", "Hypotheses"],
            "Inferential beliefs rely on other beliefs for justification.");
        Q("epistemology", "medium", "'All bachelors are unmarried males' is an example of:",
            "Analytic/a priori knowledge", ["Synthetic/a posteriori knowledge", "Empirical generalisation", "Hypothesis"],
            "It is known by pure reason; denying it is self-contradictory.");
        Q("epistemology", "medium", "'All metals expand when heated' is an example of:",
            "Synthetic/a posteriori knowledge", ["Analytic/a priori knowledge", "A tautology", "A contradiction"],
            "It is established through the senses and is contingently true.");
        Q("epistemology", "hard", "Which statement about analytic vs synthetic statements is correct?",
            "The predicate of a synthetic statement adds new information to the subject", ["Denying a synthetic statement leads to self-contradiction", "Analytic truths require sense experience", "Synthetic truths are necessarily true"],
            "Analytic predicates merely explain the subject; synthetic predicates add information.");
        Q("epistemology", "medium", "The correspondence theory of truth holds that a statement is true if it:",
            "Corresponds to reality or an actual state of affairs", ["Coheres with an established system of truths", "Is practicable or works", "Is believed by most people"],
            "It emphasises agreement between beliefs and facts.");
        Q("epistemology", "medium", "The coherence theory of truth holds that a statement is true if it:",
            "Coheres with an already established system of truth", ["Matches a fact", "Is useful in practice", "Is stated by an authority"],
            "It emphasises agreement among beliefs.");
        Q("epistemology", "medium", "The pragmatist theory of truth says a proposition is true if:",
            "What it affirms is practicable or realizable", ["It matches a fact", "It fits an established system", "It cannot be doubted"],
            "Truth is a matter of practical experience.");
        Q("epistemology", "medium", "K.A. Owolabi identifies how many dimensions to the meaning of knowledge?",
            "Three", ["Two", "Four", "Five"],
            "Cognitive consciousness, certitude on adequate grounds, and what is known.");
        Q("epistemology", "medium", "'To be is to be perceived' was said by:",
            "Bishop George Berkeley", ["John Locke", "David Hume", "Plato"],
            "Berkeley established subjective idealism.");
        Q("epistemology", "hard", "Bishop Berkeley's form of idealism is called:",
            "Subjective idealism", ["Objective idealism", "Personal idealism", "Naive realism"],
            "Objective idealists include Hegel, Spinoza and Plato.");
        Q("epistemology", "hard", "Which philosopher depicted the universe as an unfolding process of thought and the physical manifestation of God?",
            "Hegel", ["Berkeley", "Locke", "Armstrong"],
            "Hegel is an objective idealist.");
        Q("epistemology", "hard", "Naive realism, which holds that we perceive the physical world as it is, is associated with:",
            "G.E. Moore", ["John Locke", "Plato", "Hegel"],
            "Locke: representative realism; Plato: ultra realism.");
        Q("epistemology", "hard", "'A materialist theory of mind' was written by:",
            "David Armstrong", ["David Hume", "G.E. Moore", "Gilbert Ryle"],
            "Armstrong: 'Man is nothing but a material object having none but physical properties.'");
        Q("epistemology", "medium", "Subjectivism is the doctrine that:",
            "All knowledge is limited to experiences by the self", ["Objects exist independent of mind", "Reason is the only source of knowledge", "Truth is what works"],
            "Transcendent knowledge is impossible on this view.");
        Q("epistemology", "medium", "Plato distinguished two worlds:",
            "The world of appearance and the world of forms (reality)", ["Heaven and earth", "Mind and body", "Past and future"],
            "The philosopher is interested in what things are, not what they seem.");

        // ===================== METAPHYSICS =====================
        Q("metaphysics", "easy", "Metaphysics comes from 'meta' and 'physika', meaning:",
            "Beyond the physical", ["Study of nature", "Love of wisdom", "Theory of knowledge"],
            "It deals with the ultimate constituent and origin of the universe.");
        Q("metaphysics", "medium", "What is central to all metaphysical enquiries?",
            "Reality", ["Morality", "Language", "Validity"],
            "Metaphysics is a comprehensive account of the universe.");
        Q("metaphysics", "medium", "Idealism holds that the ultimate constituent of the universe is:",
            "Idea, spirit or non-matter", ["Matter", "Water", "Number"],
            "The physical world depends on the mind.");
        Q("metaphysics", "medium", "Materialism holds that:",
            "Matter is the basic substance of everything", ["Ideas are primary", "Nothing exists", "God is everything"],
            "Even mind and spirits must be explainable in material terms.");
        Q("metaphysics", "medium", "Nihilism holds that:",
            "Nothing exists (no God, no justice)", ["Only matter exists", "Only ideas exist", "Many gods exist"],
            "A nihilist may also claim nothing ought to exist.");
        Q("metaphysics", "medium", "Concepts such as humanity, beauty and justice, which many things share, are:",
            "Universals", ["Particulars", "Qualities", "Substances"],
            "Particulars are individual things like a blue car.");
        Q("metaphysics", "medium", "Those who deny that universals exist objectively and say they are only names are:",
            "Nominalists", ["Realists", "Idealists", "Dualists"],
            "Realists believe in universals.");
        Q("metaphysics", "hard", "Which is a feature of particulars?",
            "They cannot be in more than one place at a time", ["They can be in many places at once", "They are instantiated by other things", "They never pass away"],
            "Universals can be in many places at once.");
        Q("metaphysics", "medium", "Substances, as opposed to qualities, are:",
            "The substratum not open to sensory observation", ["Attributes like size, shape and colour", "Particular things only", "Names for groups"],
            "Qualities are the attributes open to the senses.");
        Q("metaphysics", "easy", "The view that man is composed of two entities, body and mind, is:",
            "Dualism", ["Monism", "Materialism", "Nihilism"],
            "Descartes was a dualist and interactionist.");
        Q("metaphysics", "medium", "Interactionism holds that:",
            "Mind and body causally influence each other", ["Mind does not exist", "God regulates mind-body correlation", "Mental events have no physical effects"],
            "Descartes was an interactionist.");
        Q("metaphysics", "hard", "Occasionalism explains mind-body correlation by:",
            "Making God the mind-body regulator", ["Identifying mind with brain", "Denying the body exists", "Parallel lines drawn eternally"],
            "It is a variant of dualism.");
        Q("metaphysics", "hard", "Leibniz's view that mental and physical events are parallel lines eternally drawn by God is:",
            "Psycho-physical parallelism", ["Epiphenomenalism", "Functionalism", "Occasionalism"],
            "Mind and body do not interact but correspond.");
        Q("metaphysics", "hard", "Epiphenomenalism holds that mental effects:",
            "Are caused by physical brain events but have no effect on physical events", ["Cause all physical events", "Are identical to brain states", "Are regulated by God"],
            "The mental is a by-product of the physical.");
        Q("metaphysics", "hard", "The view that every mental state is identical to some state of the brain or central nervous system is:",
            "Central state materialism", ["Functionalism", "Property dualism", "Idealism"],
            "Functionalism defines mental states by causal relations.");
        Q("metaphysics", "hard", "Howard Robinson's problems of the mind include consciousness, intentionality, self and:",
            "Embodiment", ["Memory", "Language", "Free will"],
            "These are four problems in the mind-body debate.");
        Q("metaphysics", "medium", "Deism holds that:",
            "One God exists but does not involve himself in his creation", ["God is identical with the universe", "Many gods exist", "God's existence cannot be known"],
            "Theism: one God who is involved.");
        Q("metaphysics", "medium", "The view that the truth about God cannot be known, so judgement should be suspended, is:",
            "Agnosticism", ["Atheism", "Deism", "Pantheism"],
            "Atheism denies God's existence.");
        Q("metaphysics", "hard", "The view that God is not identical with the universe but includes the universe is:",
            "Panentheism", ["Pantheism", "Deism", "Henotheism"],
            "Pantheism, associated with Hinduism, identifies God with the universe.");
        Q("metaphysics", "hard", "Henotheism holds that:",
            "There is a plurality of gods but allegiance is restricted to one superior god", ["Only one god exists", "No god exists", "Two gods are equal and opposed"],
            "A variation of polytheism.");
        Q("metaphysics", "medium", "Determinism is the view that:",
            "Everything that happens is necessitated by what has gone before", ["Humans are fully free", "Nothing exists", "Morality is relative"],
            "Libertarians hold that we are free and determinism is false.");
        Q("metaphysics", "hard", "A soft determinist believes that:",
            "Both determinism and free will are true", ["Determinism is true and free will is false", "Free will is true and determinism is false", "Neither is true"],
            "The hard determinist accepts determinism and rejects free will.");
        Q("metaphysics", "hard", "Greek philosophers who proposed that we are purely material beings were:",
            "Leucippus and Democritus", ["Plato and Socrates", "Thales and Heraclitus", "Aristotle and Plato"],
            "They were early materialists (atomists).");

        // ===================== ETHICS =====================
        Q("ethics", "easy", "The term 'ethics' comes from the Greek word:",
            "Ethos (custom)", ["Eros (love)", "Episteme (knowledge)", "Logos (reason)"],
            "Ethics is also called moral philosophy.");
        Q("ethics", "medium", "The branch of ethics concerned with setting standards of good moral conduct is:",
            "Normative (prescriptive) ethics", ["Descriptive ethics", "Meta-ethics", "Applied ethics"],
            "It uses teleological, deontological and virtue approaches.");
        Q("ethics", "medium", "Meta-ethics (critical ethics) examines:",
            "The meaning, nature and origin of moral standards", ["Concrete social issues", "How societies actually behave", "Laws of a country"],
            "E.g. the is/ought distinction.");
        Q("ethics", "medium", "Applied ethics:",
            "Examines the moral status of concrete social issues using ethical theories", ["Describes morality across cultures", "Analyses moral terms", "Is the same as law"],
            "Includes bioethics, business ethics and environmental ethics.");
        Q("ethics", "medium", "Psychological egoism is an example of descriptive ethics because it:",
            "Merely observes that people act to satisfy their interests, without prescribing", ["Says people ought to pursue self-interest", "Says actions must benefit others", "Rests on duty"],
            "Ethical egoism, by contrast, prescribes.");
        Q("ethics", "medium", "Ethical egoism holds that an action is morally right if:",
            "Its consequences are more favourable than unfavourable to the agent", ["It benefits everyone except the agent", "It follows God's command", "It can be universalised"],
            "Altruism favours others except the agent.");
        Q("ethics", "medium", "Ethical altruism holds that an action is right if its consequences are more favourable to:",
            "Everyone except the agent", ["The agent only", "The greatest number including the agent", "God"],
            "Acting for the benefit of others is the best thing to do.");
        Q("ethics", "easy", "Utilitarianism is based on the idea of:",
            "The greatest happiness for the greatest number", ["Duty for duty's sake", "Self-interest only", "Obeying God"],
            "It is consequentialist.");
        Q("ethics", "medium", "Rule utilitarianism holds that people should:",
            "Obey rules that provide the greatest happiness for the greatest number", ["Assess each act separately", "Pursue only their pleasure", "Follow intuition"],
            "Act utilitarianism assesses each individual action's consequences.");

        function renderTestScreen() {
            // Adjust padding specifically for test view
            contentDiv.className = "flex-grow min-h-0 flex flex-col bg-white relative";
            
            const question = state.questions[state.currentQuestionIndex];
            const progress = ((state.currentQuestionIndex) / state.questions.length) * 100;
            const isLastQuestion = state.currentQuestionIndex === state.questions.length - 1;

            let optionsHtml = '';
            question.options.forEach((opt, index) => {
                const isSelected = state.answers[state.currentQuestionIndex] === index;
                optionsHtml += `
                    <div class="mb-3 sm:mb-4 relative">
                        <input type="radio" name="option" id="opt_${index}" value="${index}" class="option-radio opacity-0 absolute inset-0 w-full h-full cursor-pointer z-10" ${isSelected ? 'checked' : ''} onchange="selectOption(${index})">
                        <label for="opt_${index}" class="option-label block w-full border border-gray-200 rounded-xl p-4 sm:p-5 cursor-pointer active:bg-gray-100 hover:bg-gray-50 flex items-center">
                            <span class="w-6 h-6 sm:w-7 sm:h-7 flex-shrink-0 border-2 rounded-full mr-4 flex items-center justify-center ${isSelected ? 'border-indigo-600 bg-indigo-600' : 'border-gray-300'}">
                                ${isSelected ? '<div class="w-2.5 h-2.5 sm:w-3 sm:h-3 bg-white rounded-full"></div>' : ''}

        function renderReviewScreen() {
            // Adjust padding to allow full natural scrolling on mobile
            contentDiv.className = "flex-grow min-h-0 flex flex-col px-4 py-6 sm:p-8 bg-white overflow-y-auto";
            
            let score = 0;
            state.questions.forEach((q, idx) => {
                if (state.answers[idx] === q.correct) score++;
            });

            const percentage = Math.round((score / state.questions.length) * 100);
            let feedback = '';
            if (percentage >= 80) feedback = "Excellent work! You have a solid grasp of the GES 106 material.";
            else if (percentage >= 50) feedback = "Good effort! Review the concepts below to solidify your understanding.";
            else feedback = "Keep studying! Carefully review the detailed rationales below to master these concepts.";

            let reviewHtml = `
                <div class="fade-in w-full max-w-3xl mx-auto pb-8">
                    
                    <!-- Score Card -->
                    <div class="text-center mb-8 bg-indigo-50 p-6 sm:p-8 rounded-2xl border border-indigo-100 shadow-sm">
                        <div class="inline-flex items-center justify-center w-20 h-20 bg-white rounded-full shadow mb-4">
                            <h2 class="text-3xl font-black text-indigo-600">${score}<span class="text-lg text-gray-400">/${state.questions.length}</span></h2>
                        </div>
                        <p class="text-xl font-bold text-gray-800 mb-2">Score: ${percentage}%</p>
                        <p class="text-sm sm:text-base text-gray-600 px-4">${feedback}</p>
                        <button onclick="initApp()" class="mt-6 w-full sm:w-auto px-8 py-3.5 sm:py-2.5 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold rounded-xl transition shadow-md">
                            <i class="fa-solid fa-rotate-right mr-2"></i> Retake Setup
                        </button>
                    </div>
                    
                    <h3 class="text-lg sm:text-xl font-bold text-gray-800 mb-4 border-b pb-3 pl-1">Score by Topic</h3>
                    <div class="space-y-2 mb-8">
                        ${Object.entries(TOPICS).map(([key, name]) => {
                            const qs = state.questions.map((q, i) => ({ q, i })).filter(x => x.q.topic === key);
                            if (qs.length === 0) return '';
                            const right = qs.filter(x => state.answers[x.i] === x.q.correct).length;
                            const pct = Math.round(right / qs.length * 100);
                            const bar = pct >= 70 ? 'bg-green-500' : pct >= 50 ? 'bg-yellow-400' : 'bg-red-500';
                            return `<div class="text-sm">
                                <div class="flex justify-between mb-1"><span class="text-gray-700 pr-2">${name}</span><span class="font-semibold text-gray-800 shrink-0">${right}/${qs.length}</span></div>
                                <div class="w-full bg-gray-200 rounded-full h-2"><div class="${bar} h-2 rounded-full" style="width:${pct}%"></div></div>
                            </div>`;
                        }).join('')}
                    </div>

                    <h3 class="text-lg sm:text-xl font-bold text-gray-800 mb-5 border-b pb-3 pl-1">Informed Review</h3>
                    <div class="space-y-5 sm:space-y-6">
            `;

            state.questions.forEach((q, idx) => {
                const userAnswer = state.answers[idx];
                const isCorrect = userAnswer === q.correct;
                const unanswered = userAnswer === undefined;

                let userChoiceText = unanswered ? "<span class='italic text-gray-400'>Not answered</span>" : q.options[userAnswer];
                let correctChoiceText = q.options[q.correct];

                reviewHtml += `
                    <div class="bg-white border rounded-2xl p-4 sm:p-6 ${isCorrect ? 'border-green-200 shadow-sm' : 'border-red-200 shadow-sm'}">
                        <div class="flex items-start">
                            <div class="mt-1 mr-3 sm:mr-4 flex-shrink-0 bg-white rounded-full">
                                ${isCorrect ? '<i class="fa-solid fa-circle-check text-green-500 text-2xl"></i>' : '<i class="fa-solid fa-circle-xmark text-red-500 text-2xl"></i>'}
                            </div>
                            <div class="flex-grow min-w-0"> <!-- min-w-0 fixes flexbox text truncation issues -->
                                <p class="font-semibold text-gray-800 mb-4 text-base sm:text-lg leading-relaxed"><span class="text-gray-400 mr-1">${idx + 1}.</span> ${q.text}</p>
                                
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-5 text-sm sm:text-base">
                                    <div class="bg-gray-50 p-3.5 sm:p-4 rounded-xl border border-gray-200">
                                        <p class="text-gray-500 mb-1.5 text-xs font-bold uppercase tracking-wider">Your Answer</p>
                                        <p class="${isCorrect ? 'text-green-700 font-semibold' : 'text-red-700 font-medium'} break-words">${userChoiceText}</p>
                                    </div>
                                    ${!isCorrect ? `
                                    <div class="bg-green-50 p-3.5 sm:p-4 rounded-xl border border-green-200">
                                        <p class="text-green-600 mb-1.5 text-xs font-bold uppercase tracking-wider">Correct Answer</p>
                                        <p class="text-green-800 font-semibold break-words">${correctChoiceText}</p>
                                    </div>
                                    ` : ''}
                                </div>

                                <div class="bg-blue-50/70 border-l-4 border-blue-400 p-4 sm:p-5 rounded-r-xl">
                                    <h4 class="text-xs font-bold text-blue-800 uppercase tracking-wider mb-2 flex items-center"><i class="fa-solid fa-book-open mr-2"></i> Rationale</h4>
                                    <p class="text-sm sm:text-base text-blue-900 leading-relaxed">${q.rationale}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            reviewHtml += `
                    </div>
                </div>
            `;
            
            contentDiv.innerHTML = reviewHtml;
            // Scroll to top of review screen
            window.scrollTo(0,0);
            if(contentDiv.scrollTo) contentDiv.scrollTo(0,0);
        }

        // --- APP LOGIC ---

        function startTest() {
            const numQ = parseInt(document.getElementById('numQuestions').value);
            const diff = document.getElementById('difficulty').value;
            const topic = document.getElementById('topic').value;
            const timeChoice = document.getElementById('timeLimit').value;

            // Filter questions
            let filteredQuestions = questionBank.filter(q =>
                (diff === 'mixed' || q.difficulty === diff) && (topic === 'all' || q.topic === topic));
            if (filteredQuestions.length === 0) {
                alert("No questions match that topic and difficulty. Try 'Mixed' difficulty.");
                return;
            }

            // Shuffle questions, take the requested count, then shuffle each question's options
            filteredQuestions = shuffleArray([...filteredQuestions]);
            const count = numQ === 0 ? filteredQuestions.length : Math.min(numQ, filteredQuestions.length);
            const selectedQuestions = filteredQuestions.slice(0, count).map(q => {
                const order = shuffleArray(q.options.map((_, i) => i));
                return { ...q, options: order.map(i => q.options[i]), correct: order.indexOf(q.correct) };
            });

            // Setup state
            state.questions = selectedQuestions;
            state.currentQuestionIndex = 0;
            state.answers = {};
            state.timeLimit = timeChoice === 'auto' ? Math.max(60, count * 45) : parseInt(timeChoice) * 60;
            state.timeRemaining = state.timeLimit;
            
            // Start Timer
            if (state.timerId) clearInterval(state.timerId);
            state.timerId = setInterval(timerTick, 1000);

            renderTestScreen();
            window.scrollTo(0,0);
        }

        function timerTick() {
            state.timeRemaining--;
            updateTimerDisplay();

            if (state.timeRemaining <= 0) {
                clearInterval(state.timerId);
                alert("Time's up! Submitting your test automatically.");
                submitTest();
            }
        }

        function updateTimerDisplay() {
            const timerEl = document.getElementById('timerDisplay');
            if (!timerEl) return;
            
            const m = Math.floor(state.timeRemaining / 60).toString().padStart(2, '0');
            const s = (state.timeRemaining % 60).toString().padStart(2, '0');
            timerEl.textContent = `${m}:${s}`;
            
            if (state.timeRemaining <= 60 && state.timeRemaining > 0) {
                timerEl.parentElement.classList.remove('text-indigo-600', 'bg-indigo-50');
                timerEl.parentElement.classList.add('text-red-600', 'bg-red-50', 'animate-pulse');
            }
        }

        function selectOption(index) {
            state.answers[state.currentQuestionIndex] = index;
            // Force re-render to update radio visual states
            renderTestScreen();
        }

        function nextQuestion() {
            if (state.currentQuestionIndex < state.questions.length - 1) {
                state.currentQuestionIndex++;
                renderTestScreen();
                window.scrollTo(0,0);
            }
        }

        function prevQuestion() {
            if (state.currentQuestionIndex > 0) {
                state.currentQuestionIndex--;
                renderTestScreen();
                window.scrollTo(0,0);
            }
        }

        function submitTest() {
            clearInterval(state.timerId);
            renderReviewScreen();
        }

        // Utility: Fisher-Yates Shuffle
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Boot
        initApp();
    </script>
</body>
</html>
